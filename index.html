<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROAD TO KSPO DOME</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: "Mulmaru";
  src: url("./fonts/Mulmaru.woff2") format("woff2");
  font-weight: 400;
  font-display: swap;
}
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #eaf3fa;
  color: #263b55;
  font-family: "Jersey 10", Arial, sans-serif;
  text-align: center;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

header {
  padding: 20px 10px 5px;
}

h1 {
  color: #6b7cff;
  font-family: "Jersey 10", sans-serif;
  font-size: 48px;
  letter-spacing: 2px;
  line-height: 1;
  margin: 5px 0;
  text-shadow: 3px 3px 0 #ffb5d0;
}

.small {
  font-family: "Jersey 10", sans-serif;
  font-size: 19px;
  letter-spacing: 1px;
  color: #71849a;
}

#game {
  width: 100%;
  max-width: 800px;
  margin: 10px auto;
  padding: 0 10px;
}

#info {
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 0;
  font-family: "Jersey 10", sans-serif;
  font-size: 22px;
  letter-spacing: 1px;
  color: #526a91;
}

#info span span {
  color: #6b7cff;
  font-size: 25px;
}

#progress {
  width: 100%;
  height: 13px;
  background: #d0dfeb;
  border: 2px solid #afcbda;
  border-radius: 3px;
  overflow: hidden;
  margin: 5px 0 10px;
}

#progressBar {
  height: 100%;
  width: 0%;
  background: repeating-linear-gradient(
    90deg,
    #6b7cff 0px,
    #6b7cff 12px,
    #9b8cff 12px,
    #9b8cff 16px
  );
  transition: width 0.1s linear;
}

canvas {
  width: 100%;
  display: block;
  background: #dff1ff;
  border: 4px solid #afcbda;
  border-radius: 5px;
  box-shadow: 5px 5px 0 #c7d7e8;
  touch-action: none;
}

#message {
  padding: 12px 5px;
  min-height: 45px;
  font-family: "Jersey 10", sans-serif;
  font-size: 23px;
  letter-spacing: 1px;
  color: #6b7cff;
}

button {
  background: #6b7cff;
  color: white;
  border: 3px solid #263b55;
  border-radius: 4px;
  box-shadow: 4px 4px 0 #263b55;
  padding: 10px 42px;
  font-family: "Jersey 10", sans-serif;
  font-size: 27px;
  letter-spacing: 1px;
  cursor: pointer;
  margin: 8px;
}

button:active {
  transform: translate(3px, 3px);
  box-shadow: 1px 1px 0 #263b55;
}

#pause {
  background: #ff9ab8;
  display: none;
  padding: 10px 30px;
}

.small {
  margin-top: 12px;
}

/* キャラクター選択画面 */
#characterSelect {
  max-width: 800px;
  margin: 15px auto 25px;
  padding: 20px 12px;
  background: #f5f9ff;
  border: 4px solid #afcbda;
  border-radius: 8px;
  box-shadow: 5px 5px 0 #c7d7e8;
}

.select-title {
  color: #ffb5d0;
  font-size: 34px;
  letter-spacing: 2px;
  margin: 0 0 5px;
}

.select-subtitle {
  color: #71849a;
  font-size: 18px;
  margin-bottom: 20px;
}

.character-list {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 15px auto 25px;
}

.character-card {
  flex: 1;
  max-width: 210px;
  min-width: 0;
  padding: 12px 5px;
  background: #ffffff;
  border: 3px solid #c7d7e8;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.15s;
  overflow: hidden;
}

.character-card.selected {
  border-color: #6b7cff;
  background: #edf0ff;
  box-shadow: 0 0 0 3px #d9ddff;
  transform: translateY(-4px);
}

.character-card .member-name {
  display: block;
  color: #263b55;
  font-size: 25px;
  margin-top: 8px;
}

.character-card .member-name-en {
  display: block;
  color: #8a9bb0;
  font-size: 17px;
}

.character-preview {
  width: 100%;
  height: 200px; /* 水色枠の高さ */
  display: flex;
  align-items: center;
  justify-content: center;
  background: #eaf3fa;
  border-radius: 5px;
  overflow: hidden;
}

.preview-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

#selectedMessage {
  color: #6b7cff;
  font-size: 20px;
  min-height: 25px;
  margin: 10px 0;
}

#characterStart {
  min-width: 180px;
}
.rule-guide {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px 28px;
  margin: 12px auto 16px;
  padding: 10px 16px;
  max-width: 640px;
  background: #eaf3fa;
  border: 2px dashed #afcbda;
  border-radius: 8px;
  pointer-events: none;
}

.rule-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.rule-label {
  font-size: 20px;
  letter-spacing: 1px;
  color: #526a91;
  line-height: 1.1;
  text-align: center;
}

.rule-icons {
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.rule-tap-text {
  font-size: 20px;
  letter-spacing: 1px;
  color: #526a91;
  line-height: 36px;
  text-align: center;
  white-space: nowrap;
}

.rule-canvas {
  height: 36px;
  width: auto;
  display: block;
}

@media (max-width: 480px) {
  .character-list {
    gap: 7px;
  }

  .character-card {
    padding: 8px 3px;
  }

  .character-preview {
    height: 120px; /* スマホでもさらにコンパクトに */
  }

  .character-card .member-name {
    font-size: 21px;
  }

  .character-card .member-name-en {
    font-size: 15px;
  }
}
/* ゲーム開始前はゲーム画面を隠す */
#game {
  display: none;
}
  
</style>
</head>

<body>

<header>
  <h1>ROAD TO KSPO DOME</h1>
  <div class="small">RUN TO YOUR DREAM!</div>
</header>

<div id="characterSelect">

  <h2 class="select-title">CHOOSE YOUR RUNNER!</h2>
  <div class="select-subtitle">WHO WILL RUN TO KSPO DOME?</div>

  <div class="character-list">

  <div class="character-card selected" data-character="yonghwa">
    <div class="character-preview">
      <canvas class="preview-canvas" width="90" height="110"></canvas>
    </div>
    <span class="member-name">YONG</span>
  </div>

  <div class="character-card" data-character="minhyuk">
    <div class="character-preview">
      <canvas class="preview-canvas" width="90" height="110"></canvas>
    </div>
    <span class="member-name">MIN</span>
  </div>

  <div class="character-card" data-character="jungshin">
    <div class="character-preview">
      <canvas class="preview-canvas" width="90" height="110"></canvas>
    </div>
    <span class="member-name">SHIN</span>
  </div>

</div>
  
    <div id="selectedMessage">YONG SELECTED!</div>

    <div id="ruleGuide" class="rule-guide" aria-hidden="true">
    <div class="rule-item">
      <div class="rule-label"></div>
      <div class="rule-icons">
        <span class="rule-tap-text">TAP TO JUMP!</span>
      </div>
    </div>

    <div class="rule-item">
      <div class="rule-label">GET!</div>
      <canvas id="getIconsCanvas" class="rule-canvas" width="96" height="36"></canvas>
    </div>

    <div class="rule-item">
      <div class="rule-label">AVOID!</div>
      <canvas id="avoidIconsCanvas" class="rule-canvas" width="108" height="36"></canvas>
    </div>
  </div>

  <button id="characterStart">START</button>

</div>

<div id="game">

  <div id="info">
    <span>SCORE: <span id="score">0</span></span>
    <span>TIME: <span id="time">00:00</span></span>
    <span>DISTANCE: <span id="distance">0%</span></span>
  </div>

  <div id="progress">
    <div id="progressBar"></div>
  </div>

  <canvas id="canvas" width="800" height="360"></canvas>

  <div id="message">LET'S RUN TO KSPO DOME!</div>

  <button id="pause">PAUSE</button>
  <button id="start" style="display:none;">RETRY</button>

    <!-- クリア時だけ表示するXシェア＆リザルト画像エリア -->
  <div id="shareArea" style="display:none; margin-top: 14px; text-align: center;">
    <button id="saveImgBtn" type="button" style="cursor:pointer; padding:10px 18px; font-family:'Jersey 10', Arial; font-size:22px; background:#ffb5d0; color:#ffffff; border:2px solid #263b55; border-radius:8px;">
      SAVE IMAGE
    </button>
    <button id="shareXBtn" type="button" style="cursor:pointer; padding:10px 18px; font-family:'Jersey 10', Arial; font-size:22px; background:#111111; color:#ffffff; border:2px solid #263b55; border-radius:8px;">
      SHARE ON X
    </button>
    <img id="resultCardImg" alt="GOAL RESULT CARD" style="display:none; width:100%; max-width:460px; margin:10px auto 0; border:2px solid #263b55; border-radius:8px;" />
  </div>

<p class="small">TAP TO JUMP!</p>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const distanceEl = document.getElementById("distance");
const progressBar = document.getElementById("progressBar");
const message = document.getElementById("message");
const startBtn = document.getElementById("start");
const pauseBtn = document.getElementById("pause");

const characterSelect = document.getElementById("characterSelect");
const characterStartBtn = document.getElementById("characterStart");
const selectedMessage = document.getElementById("selectedMessage");
const game = document.getElementById("game");

const spriteImg = new Image();

spriteImg.addEventListener("load", () => {
  drawCharacterPreviews();
  draw();
});
spriteImg.src = "./9771.jpg";

let selectedCharacter = "yonghwa";

const W = 800;
const H = 360;
const ground = 285;

// ゴールまでの距離
const TOTAL_DISTANCE = 18000;

// 基本スピード
const SPEED_EARLY = 300;
const SPEED_MIDDLE = 340;
const SPEED_LATE = 380;

// アイテム取得時の加速
const BOOST_AMOUNT = 30;
const BOOST_DURATION = 3;

// 障害物にぶつかったときの減速
const HIT_SLOW_DURATION = 2.5;
const HIT_SLOW_RATE = 0.75;

let state = "ready";
let score = 0;
let elapsed = 0;
let distance = 0;
let lastTime = 0;

let obstacles = [];
let items = [];

let spawnTimer = 0;
let itemTimer = 0;
let hitFlash = 0;

let hitCount = 0;
let collectedCount = 0;
let jumpCount = 0;

let boostTimer = 0;
let hitSlowTimer = 0;
let runAnimationTime = 0;

let latestShareDataUrl = "";

const player = {
  x: 110,
  y: ground - 64,
  w: 48,
  h: 64,
  vy: 0,
  jumping: false
};

function formatTime(seconds) {
  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);

  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0")
  );
}

function resetGame() {
  score = 0;
  elapsed = 0;
  distance = 0;

  obstacles = [];
  items = [];

  spawnTimer = 1.8;
  itemTimer = 1.5;

  hitFlash = 0;
  hitCount = 0;
  collectedCount = 0;
  jumpCount = 0;
  boostTimer = 0;
  hitSlowTimer = 0;

  player.y = ground - player.h;
  player.vy = 0;
  player.jumping = false;

  updateInfo();
}

function startGame() {
  resetGame();

  state = "running";

  message.textContent = "GO! RUN TO KSPO!";
  startBtn.style.display = "none";

  pauseBtn.style.display = "inline-block";
  pauseBtn.textContent = "PAUSE";

  lastTime = performance.now();

  requestAnimationFrame(loop);
}

function togglePause() {
  if (state === "running") {
    state = "paused";

    message.textContent = "PAUSED";
    pauseBtn.textContent = "RESUME";

    draw();

  } else if (state === "paused") {
    state = "running";

    message.textContent = "GO! RUN TO KSPO!";
    pauseBtn.textContent = "PAUSE";

    lastTime = performance.now();

    requestAnimationFrame(loop);
  }
}

  function jump() {
  if (state !== "running") return;
  if (player.jumping) return;

  player.vy = -650;
  player.jumping = true;

  jumpCount++;
  }

canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  jump();
});

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    jump();
  }
});

// キャラクター選択
document.querySelectorAll(".character-card").forEach(card => {
  card.addEventListener("click", () => {

    document.querySelectorAll(".character-card").forEach(c => {
      c.classList.remove("selected");
    });

    card.classList.add("selected");

    selectedCharacter = card.dataset.character;

    const names = {
  yonghwa: "YONG",
  minhyuk: "MIN",
  jungshin: "SHIN"
};

    selectedMessage.textContent =
      names[selectedCharacter] + " SELECTED!";
    
    console.log("選択中:", selectedCharacter);
  });
});

// 選択してゲーム開始
characterStartBtn.addEventListener("click", () => {
  characterSelect.style.display = "none";
  game.style.display = "block";
  startGame();
});

// RETRYボタン
startBtn.addEventListener("click", () => {
  startBtn.style.display = "none";
  if (shareArea) shareArea.style.display = "none";

  latestShareDataUrl = "";
  runAnimationTime = 0;
  const imgEl = document.getElementById("resultCardImg");
  if (imgEl) {
    imgEl.removeAttribute("src");
    imgEl.style.display = "none";
  }

  document.getElementById("game").style.display = "none";
  document.getElementById("characterSelect").style.display = "block";

  pauseBtn.style.display = "inline-block";
  pauseBtn.textContent = "PAUSE";

  state = "ready";
});

pauseBtn.addEventListener("click", togglePause);

function updateInfo() {
  scoreEl.textContent = score;
  timeEl.textContent = formatTime(elapsed);

  const percent = Math.min(
    100,
    (distance / TOTAL_DISTANCE) * 100
  );

  distanceEl.textContent = Math.floor(percent) + "%";
  progressBar.style.width = percent + "%";
}

// 進行度に応じた基本スピード
function getBaseSpeed() {
  const progress = distance / TOTAL_DISTANCE;

  if (progress < 1 / 3) {
    return SPEED_EARLY;
  }

  if (progress < 2 / 3) {
    return SPEED_MIDDLE;
  }

  return SPEED_LATE;
}

// 現在のスピード
function getSpeed() {

  const normalSpeed = getBaseSpeed() +
    (boostTimer > 0 ? BOOST_AMOUNT : 0);

  const slowProgress = hitSlowTimer / HIT_SLOW_DURATION;

  const slowRate = 1 - (1 - HIT_SLOW_RATE) * slowProgress;

  return normalSpeed * slowRate;

}

// アイテム取得時の加速
function activateBoost() {
  boostTimer = BOOST_DURATION;
}


function spawnObstacle() {
  const spawnX = W + 20;

  // ゴールまで残り約4秒になったら新しい障害物を出さない
  const remainingDistance = TOTAL_DISTANCE - distance;

  if (remainingDistance <= getSpeed() * 4) {
    return false;
  }

  // アイテムの近くには障害物を出さない
  const blocked = items.some(item =>
    Math.abs(item.x - spawnX) < 220
  );

  if (blocked) return false;

  const types = [
  { name: "CASE", w: 52, h: 60 },
  { name: "CABLE", w: 70, h: 24 },
  { name: "CONE", w: 42, h: 58 }
];

  const type = types[
    Math.floor(Math.random() * types.length)
  ];

  obstacles.push({
    x: spawnX,
    y: ground - type.h,
    w: type.w,
    h: type.h,
    name: type.name,
    passed: false
  });

  return true;
}


function spawnItem() {
  const spawnX = W + 20;

  const obstacleNearby = obstacles.some(o =>
    Math.abs(o.x - spawnX) < 220
  );

  const itemNearby = items.some(item =>
    Math.abs(item.x - spawnX) < 130
  );

  if (obstacleNearby || itemNearby) return false;

  const types = [
    { name: "BOTTLE", points: 100, color: "#55a9df" },
    { name: "TOWEL", points: 150, color: "#ff9ab8" },
    { name: "FLAG", points: 200, color: "#6b7cff" }
  ];

  const type = types[
    Math.floor(Math.random() * types.length)
  ];

 const remainingDistance = TOTAL_DISTANCE - distance;
const isNearGoal = remainingDistance <= getSpeed() * 2;

let y;

if (isNearGoal) {
  y = ground - 20;
} else {
  const r = Math.random();

  if (r < 0.35) y = ground - 20;
  else if (r < 0.70) y = ground - 45;
  else y = ground - 140;
}

  items.push({
    x: spawnX,
    y: y,
    w: 25,
    h: 25,
    points: type.points,
    name: type.name,
    color: type.color
  });

  return true;
}

function overlap(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function update(dt) {
  elapsed = Math.max(0, elapsed + dt);
  if (!player.jumping) {
  runAnimationTime += dt;
  }

  // 加速時間を減らす
if (boostTimer > 0) {
  boostTimer = Math.max(0, boostTimer - dt);
}

// 減速時間を減らす
if (hitSlowTimer > 0) {
  hitSlowTimer = Math.max(0, hitSlowTimer - dt);
}

  const speed = getSpeed();

  // 距離を進める
  distance = Math.max(0, distance + speed * dt);

  // ゴール到着
  // ドームの入口に到着したらゴール
const remainingDistance = TOTAL_DISTANCE - distance;

if (remainingDistance <= 50) {
  distance = TOTAL_DISTANCE;
  updateInfo();
  finishGame();
  return;
}

  // ジャンプ
  player.vy += 1700 * dt;
  player.y += player.vy * dt;

  if (player.y >= ground - player.h) {
    player.y = ground - player.h;
    player.vy = 0;
    player.jumping = false;
  }

  // 障害物出現
  spawnTimer -= dt;

  if (spawnTimer <= 0) {
    const spawned = spawnObstacle();

    spawnTimer = spawned
      ? 2.0 + Math.random() * 0.8
      : 0.25;
  }

  obstacles.forEach(o => {
    o.x -= speed * dt;

    if (!o.passed && overlap(player, o)) {
      score = Math.max(0, score - 100);
      o.passed = true;
      hitCount++;
      hitFlash = 0.2;
      hitSlowTimer = HIT_SLOW_DURATION;
    }
  });

  obstacles = obstacles.filter(o =>
    o.x + o.w > 0
  );

  // アイテム出現
  itemTimer -= dt;

  if (itemTimer <= 0) {
    const spawned = spawnItem();

    itemTimer = spawned
      ? 1.5 + Math.random() * 1.0
      : 0.25;
  }

  items.forEach(item => {
    item.x -= speed * dt;

    // 横方向に少し取得判定を広げる
    const itemHitbox = {
      x: item.x - 8,
      y: item.y,
      w: item.w + 16,
      h: item.h
    };

    if (overlap(player, itemHitbox)) {
      score += item.points;
      item.collected = true;
      collectedCount++;

      // アイテム取得で一時加速
      activateBoost();
    }
  });

  items = items.filter(item =>
    item.x + item.w > 0 && !item.collected
  );

  hitFlash = Math.max(0, hitFlash - dt);

  updateInfo();
}


function drawBackground() {
  // 空
  ctx.fillStyle = "#dff1ff";
  ctx.fillRect(0, 0, W, H);

  // 遠くの空の模様
  ctx.fillStyle = "#c9e5f5";
  ctx.fillRect(0, 130, W, 2);

  // ドット雲
  for (let i = 0; i < 5; i++) {
    const x = (
      (i * 190 - distance * 0.07 + 1000) % 1000 + 1000
    ) % 1000;

    const y = 65 + (i % 2) * 25;

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x, y + 8, 54, 16);
    ctx.fillRect(x + 8, y, 30, 8);
    ctx.fillRect(x + 18, y - 5, 18, 8);
    ctx.fillRect(x + 45, y + 3, 12, 10);

    ctx.fillStyle = "#afcbda";
    ctx.fillRect(x + 5, y + 20, 45, 3);
  }

    // 遠くのソウルっぽい山シルエット（うっすらパステル）
  ctx.fillStyle = "#cde6f7";
  ctx.beginPath();
  ctx.moveTo(0, ground);
  ctx.lineTo(0, 195);
  ctx.lineTo(130, 155);
  ctx.lineTo(250, 182);
  ctx.lineTo(410, 145);
  ctx.lineTo(560, 175);
  ctx.lineTo(710, 150);
  ctx.lineTo(800, 178);
  ctx.lineTo(800, ground);
  ctx.closePath();
  ctx.fill();

  // 遠くの建物（ビル＋屋上看板・ハングル風ドット）
  for (let i = 0; i < 12; i++) {
    const x = (
      (i * 95 - distance * 0.09 + 1200) % 1200 + 1200
    ) % 1200;

    const h = 58 + (i % 4) * 14;
    const y = ground - h;

    ctx.fillStyle = "#c2dce9";
    ctx.fillRect(x, y, 66, h);

    // 屋上看板（韓国の街角っぽい縦長・横長サイン）
    if (i % 2 === 0) {
      ctx.fillStyle = "#9fd8ff";
      ctx.fillRect(x + 8, y - 12, 22, 12);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(x + 11, y - 9, 16, 2);
      ctx.fillRect(x + 11, y - 6, 12, 2);
    } else {
      ctx.fillStyle = "#ffd1e3";
      ctx.fillRect(x + 42, y - 15, 12, 15);
      ctx.fillStyle = "#ffffff";

  const progress = Math.max(
    0,

  );

  const x = 680 - progress * 600;

  // ドーム周辺のキラキラ

    [220, -95],

function getVenueGateCoords(gx, baseY) {
  const backX = gx - 18;
  const backTopY = baseY - 120;
  const backBottomY = baseY + 10;

  const frontX = gx + 35;
  const frontTopY = baseY - 60;
  const frontBottomY = baseY + 60;

  return { backX, backTopY, backBottomY, frontX, frontTopY, frontBottomY };
}

function drawVenueGateBackAndBar(gx, baseY) {
  const { backX, backTopY, backBottomY, frontX, frontTopY } = getVenueGateCoords(gx, baseY);
  ctx.save();

  // 奥の柱
  ctx.fillStyle = "#263b55";
  ctx.fillRect(backX - 4, backTopY, 8, backBottomY - backTopY);
  ctx.fillStyle = "#dff1ff";
  ctx.fillRect(backX - 2, backTopY + 2, 4, backBottomY - backTopY - 2);

  // 斜めに渡すゲートバー
  ctx.strokeStyle = "#263b55";
  ctx.lineWidth = 16;
  ctx.lineCap = "square";
  ctx.beginPath();
  ctx.moveTo(backX, backTopY + 4);
  ctx.lineTo(frontX, frontTopY + 4);
  ctx.stroke();

  ctx.strokeStyle = "#6b7cff";
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.moveTo(backX, backTopY + 4);
  ctx.lineTo(frontX, frontTopY + 4);
  ctx.stroke();

  ctx.strokeStyle = "#ff9ab8";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(backX, backTopY);
  ctx.lineTo(frontX, frontTopY);
  ctx.stroke();

  ctx.strokeStyle = "#9fd8ff";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(backX, backTopY + 8);
  ctx.lineTo(frontX, frontTopY + 8);
  ctx.stroke();

  // バー中央の星ドット
  const midX = (backX + frontX) / 2;
  const midY = (backTopY + frontTopY) / 2 + 4;
  ctx.fillStyle = "#fff4c2";
  ctx.fillRect(midX - 3, midY - 3, 6, 6);

  ctx.restore();
}

function drawVenueGateFrontPost(gx, baseY) {
  const { frontX, frontTopY, frontBottomY } = getVenueGateCoords(gx, baseY);
  ctx.save();

  // 手前の柱（ドームよりあとに描くから前に出る！）
  ctx.fillStyle = "#263b55";
  ctx.fillRect(frontX - 5, frontTopY, 10, frontBottomY - frontTopY);
  ctx.fillStyle = "#dff1ff";
  ctx.fillRect(frontX - 3, frontTopY + 2, 6, frontBottomY - frontTopY - 2);

  ctx.restore();
}

function drawCharacterPreviews() {
  if (!spriteImg.complete || !spriteImg.naturalWidth) return;

  const imgW = spriteImg.naturalWidth;
  const imgH = spriteImg.naturalHeight;

  document.querySelectorAll(".character-card").forEach(card => {
    const key = card.dataset.character;
    const canvasEl = card.querySelector(".preview-canvas");
    if (!canvasEl || !topStandRatios[key]) return;

    // 実際の表示サイズに合わせて内部解像度も合わせる
    const rect = canvasEl.getBoundingClientRect();
    const cw = Math.max(1, Math.round(rect.width));
    const ch = Math.max(1, Math.round(rect.height));
    canvasEl.width = cw;
    canvasEl.height = ch;

    const pCtx = canvasEl.getContext("2d");
    const r = topStandRatios[key];

    const sx = r.rx * imgW;
    const sy = r.ry * imgH;
    const sw = r.rw * imgW;
    const sh = r.rh * imgH;

    pCtx.clearRect(0, 0, cw, ch);
    pCtx.imageSmoothingEnabled = false;

    // 0.88 くらいにすると「全身が切れない＋ちゃんと大きく見える」いい塩梅になるよ！
    const scale = Math.min(cw / sw, ch / sh) * 0.88;
    const dw = sw * scale;
    const dh = sh * scale;
    const dx = (cw - dw) / 2;
    const dy = (ch - dh) / 2;

    pCtx.drawImage(spriteImg, sx, sy, sw, sh, dx, dy, dw, dh);
  });
}

function drawPlayer() {
  if (!spriteImg.complete || !spriteImg.naturalWidth) return;

  const x = Math.round(player.x);
  const y = Math.round(player.y);

  const key = selectedCharacter || "yonghwa";
  const frames = runRatios[key] || runRatios.yonghwa;

  const running = state === "running" && !player.jumping;
  const frameIndex = running ? Math.floor(runAnimationTime * 10) % frames.length : 0;
  const r = frames[frameIndex];

  const imgW = spriteImg.naturalWidth;
  const imgH = spriteImg.naturalHeight;
  const sx = r.rx * imgW;
  const sy = r.ry * imgH;
  const sw = r.rw * imgW;
  const sh = r.rh * imgH;

  const bob = running ? Math.round(Math.abs(Math.sin(runAnimationTime * 10)) * 2) : 0;

  
  ctx.imageSmoothingEnabled = false;
    const scale = 1.25; // 1.2 〜 1.4 くらいで好みに合わせてね
  const drawW = player.w * scale;
  const drawH = player.h * scale;
  const drawX = x - (drawW - player.w) / 2;
  const drawY = y + bob - (drawH - player.h);

  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(spriteImg, sx, sy, sw, sh, drawX, drawY, drawW, drawH);
  ctx.restore();
}

// 3人ニコニコジャンプを横にくっつけて描画するヘルパー
function drawThreeJumpers(targetCtx, centerX, bottomY, targetHeight) {
  if (!spriteImg.complete || !spriteImg.naturalWidth) return;

  const imgW = spriteImg.naturalWidth;
  const imgH = spriteImg.naturalHeight;

  targetCtx.save();
  targetCtx.imageSmoothingEnabled = false;

  const spacing = 4; // 3人くっつけ気味にする隙間（0にすると完全密着）
  const items = bottomJumpRatios.map(r => {
    const sw = r.rw * imgW;
    const sh = r.rh * imgH;
    const scale = targetHeight / sh;
    const dw = sw * scale;
    const dh = targetHeight;
    return { r, sw, sh, dw, dh };
  });

  const totalW = items.reduce((sum, item) => sum + item.dw, 0) + spacing * (items.length - 1);
  let curX = centerX - totalW / 2;

  items.forEach(item => {
    const sx = item.r.rx * imgW;
    const sy = item.r.ry * imgH;
    const dy = bottomY - item.dh;

    targetCtx.drawImage(spriteImg, sx, sy, item.sw, item.sh, curX, dy, item.dw, item.dh);
    curX += item.dw + spacing;
  });

  targetCtx.restore();
}


    function drawObstacle(o, targetCtx = ctx) {
  const x = Math.round(o.x);
  const y = Math.round(o.y);

   // アンプ（旧：機材ケース）
  if (o.name === "CASE") {
    // 外枠（濃い紺）
    targetCtx.fillStyle = "#263b55";
    targetCtx.fillRect(x, y, 52, 60);

    // アンプ本体
    targetCtx.fillStyle = "#71849a";
    targetCtx.fillRect(x + 3, y + 5, 46, 52);

    // 上部コントロールパネル
    targetCtx.fillStyle = "#dff1ff";
    targetCtx.fillRect(x + 6, y + 8, 40, 12);

    // 丸っぽいツマミ（3つ）
    const knobXs = [10, 19, 28];
    knobXs.forEach((kx, idx) => {
      // ツマミの外枠（丸っぽく上下を1pxずつ削る）
      targetCtx.fillStyle = "#263b55";
      targetCtx.fillRect(x + kx + 1, y + 10, 4, 8);
      targetCtx.fillRect(x + kx, y + 11, 6, 6);

      // ツマミの中身
      targetCtx.fillStyle = idx === 2 ? "#ff9ab8" : "#6b7cff";
      targetCtx.fillRect(x + kx + 1, y + 11, 4, 6);

      // ツマミのハイライト
      targetCtx.fillStyle = "#ffffff";
      targetCtx.fillRect(x + kx + 2, y + 12, 2, 2);
    });

    // パイロットランプ（丸っぽく）
    targetCtx.fillStyle = "#263b55";
    targetCtx.fillRect(x + 39, y + 11, 4, 6);
    targetCtx.fillStyle = "#ffd85c";
    targetCtx.fillRect(x + 40, y + 12, 2, 4);

    // スピーカーグリル（メッシュ部分・真ん中の四角なし）
    targetCtx.fillStyle = "#3c4d66";
    targetCtx.fillRect(x + 6, y + 23, 40, 31);

    // 細かいドットメッシュ
    targetCtx.fillStyle = "#526a91";
    for (let my = y + 26; my <= y + 50; my += 4) {
      for (let mx = x + 9; mx <= x + 42; mx += 4) {
        targetCtx.fillRect(mx, my, 2, 2);
      }
    }

    // コーナー金具
    targetCtx.fillStyle = "#ffffff";
    targetCtx.fillRect(x + 3, y + 5, 5, 5);
    targetCtx.fillRect(x + 44, y + 5, 5, 5);
    targetCtx.fillRect(x + 3, y + 52, 5, 5);
    targetCtx.fillRect(x + 44, y + 52, 5, 5);

    // トップハンドル
    targetCtx.fillStyle = "#263b55";
    targetCtx.fillRect(x + 17, y, 18, 6);
    targetCtx.fillStyle = "#afcbda";
    targetCtx.fillRect(x + 20, y + 2, 12, 2);
  }

  // 段ボール
  else if (o.name === "CABLE") {
    // 箱の外枠
    targetCtx.fillStyle = "#263b55";
    targetCtx.fillRect(x + 3, y + 9, 50, 33);
    targetCtx.fillRect(x + 49, y + 5, 7, 37);
    targetCtx.fillRect(x + 7, y + 2, 43, 9);

    // 箱の上面
    targetCtx.fillStyle = "#dfb07a";
    targetCtx.fillRect(x + 8, y + 5, 40, 5);
    targetCtx.fillRect(x + 48, y + 9, 5, 3);

    // 箱の正面
    targetCtx.fillStyle = "#c88d55";
    targetCtx.fillRect(x + 5, y + 12, 44, 27);

    // フタの境目ライン
    targetCtx.fillStyle = "#8f5d34";
    targetCtx.fillRect(x + 5, y + 18, 44, 2);

    // 右側面
    targetCtx.fillStyle = "#a96f43";
    targetCtx.fillRect(x + 49, y + 12, 5, 27);

    // ガムテープ
    targetCtx.fillStyle = "#e8c596";
    targetCtx.fillRect(x + 25, y + 3, 8, 9);
    targetCtx.fillRect(x + 25, y + 12, 8, 7);

    // 正面の配送ラベル
    targetCtx.fillStyle = "#ffffff";
    targetCtx.fillRect(x + 34, y + 23, 11, 9);

    targetCtx.fillStyle = "#71849a";
    targetCtx.fillRect(x + 36, y + 25, 7, 2);
    targetCtx.fillRect(x + 36, y + 29, 5, 1);

    // 箱の角のハイライト
    targetCtx.fillStyle = "#f2cca0";
    targetCtx.fillRect(x + 6, y + 13, 2, 24);
  }

  // 三角コーン
  else if (o.name === "CONE") {
    // 底の黒い台座
    targetCtx.fillStyle = "#263b55";
    targetCtx.fillRect(x, y + 51, 42, 7);

    // コーンの輪郭
    targetCtx.fillRect(x + 5, y + 43, 32, 8);
    targetCtx.fillRect(x + 10, y + 30, 22, 13);
    targetCtx.fillRect(x + 14, y + 17, 14, 13);
    targetCtx.fillRect(x + 18, y + 7, 6, 10);
    targetCtx.fillRect(x + 19, y + 4, 4, 3);

    // オレンジ本体
    targetCtx.fillStyle = "#f28b48";
    targetCtx.fillRect(x + 7, y + 45, 28, 5);
    targetCtx.fillRect(x + 12, y + 32, 18, 11);
    targetCtx.fillRect(x + 16, y + 19, 10, 11);
    targetCtx.fillRect(x + 19, y + 8, 4, 9);

    // 白い反射ライン（くっきり2段）
    targetCtx.fillStyle = "#ffffff";
    targetCtx.fillRect(x + 12, y + 34, 18, 4);
    targetCtx.fillRect(x + 16, y + 21, 10, 4);

    // 台座のハイライト
    targetCtx.fillStyle = "#9fd8ff";
    targetCtx.fillRect(x + 4, y + 53, 34, 2);
  }
}

function drawItem(item, targetCtx = ctx) {
  const x = Math.round(item.x);
  const y = Math.round(item.y);

  targetCtx.save();
  targetCtx.translate(x, y - 10);
  targetCtx.scale(1.8, 1.8);

  // ペットボトル（首のくびれ＋ラベルでドリンク感を強調）
  if (item.name === "BOTTLE") {
    // 外枠
    targetCtx.fillStyle = "#263b55";
    targetCtx.fillRect(10, 1, 5, 3);
    targetCtx.fillRect(11, 4, 3, 3);
    targetCtx.fillRect(6, 7, 13, 16);
    targetCtx.fillRect(8, 23, 9, 2);

    // キャップ（濃い青でアクセント）
    targetCtx.fillStyle = "#6b7cff";
    targetCtx.fillRect(10, 0, 5, 3);

    // 首〜ボトル本体
    targetCtx.fillStyle = "#9fd8ff";
    targetCtx.fillRect(11, 4, 3, 3);
    targetCtx.fillRect(8, 8, 9, 14);

    // 水のハイライト
    targetCtx.fillStyle = "#ffffff";
    targetCtx.fillRect(9, 9, 2, 11);

    // ラベル帯（白＋ピンクハート）
    targetCtx.fillStyle = "#ffffff";
    targetCtx.fillRect(7, 13, 11, 6);
    targetCtx.fillStyle = "#ff9ab8";
    targetCtx.fillRect(10, 15, 2, 2);
    targetCtx.fillRect(13, 15, 2, 2);
    targetCtx.fillRect(11, 17, 3, 1);

    // キラキラ（ちょっとくっきり目印ver）
    targetCtx.fillStyle = "#263b55";
    targetCtx.fillRect(19, 19, 8, 4);
    targetCtx.fillRect(21, 17, 4, 8);

    targetCtx.fillStyle = "#ffd85c";
    targetCtx.fillRect(20, 20, 6, 2);
    targetCtx.fillRect(22, 18, 2, 6);
  }

  // ペンライト（丸いヘッド＋中央ダイヤをくっきり）
  else if (item.name === "TOWEL") {
    // 持ち手
    targetCtx.fillStyle = "#263b55";
    targetCtx.fillRect(12, 18, 6, 11);
    targetCtx.fillStyle = "#526a91";
    targetCtx.fillRect(13, 19, 3, 9);

    // 丸いヘッドの外枠
    targetCtx.fillStyle = "#263b55";
    targetCtx.fillRect(9, 0, 12, 2);
    targetCtx.fillRect(5, 2, 20, 2);
    targetCtx.fillRect(3, 5, 24, 11);
    targetCtx.fillRect(5, 16, 20, 2);
    targetCtx.fillRect(9, 18, 12, 2);

    // ヘッド本体（明るい水色〜白）
    targetCtx.fillStyle = "#dff1ff";
    targetCtx.fillRect(10, 2, 10, 2);
    targetCtx.fillRect(7, 4, 16, 2);
    targetCtx.fillRect(5, 6, 20, 9);
    targetCtx.fillRect(7, 15, 16, 2);

    // 中央の青いダイヤ（くっきり目立たせる）
    targetCtx.fillStyle = "#6b7cff";
    targetCtx.fillRect(14, 5, 2, 1);
    targetCtx.fillRect(12, 6, 6, 2);
    targetCtx.fillRect(10, 8, 10, 3);
    targetCtx.fillRect(12, 11, 6, 2);
    targetCtx.fillRect(14, 13, 2, 1);

    // ダイヤの中心ハイライト
    targetCtx.fillStyle = "#ffffff";
    targetCtx.fillRect(13, 8, 2, 2);

    // キラキラ（ちょっとくっきり目印ver）
    targetCtx.fillStyle = "#263b55";
    targetCtx.fillRect(19, 19, 8, 4);
    targetCtx.fillRect(21, 17, 4, 8);

    targetCtx.fillStyle = "#ffd85c";
    targetCtx.fillRect(20, 20, 6, 2);
    targetCtx.fillRect(22, 18, 2, 6);
  }
  
  // 旗（白地に青いハート）
  else if (item.name === "FLAG") {
    // ポール
    targetCtx.fillStyle = "#263b55";
    targetCtx.fillRect(4, 2, 3, 22);

    targetCtx.fillStyle = "#ffffff";
    targetCtx.fillRect(5, 4, 1, 17);

    // 旗の外枠
    targetCtx.fillStyle = "#263b55";
    targetCtx.fillRect(7, 3, 17, 13);
    targetCtx.fillRect(9, 16, 13, 2);

    // 旗本体（白地＋水色っぽい影）
    targetCtx.fillStyle = "#ffffff";
    targetCtx.fillRect(9, 5, 13, 9);
    targetCtx.fillRect(11, 14, 9, 2);

    targetCtx.fillStyle = "#dff1ff";
    targetCtx.fillRect(9, 12, 13, 2);
    targetCtx.fillRect(11, 14, 9, 1);

    // 青いハート（ドット風）
    targetCtx.fillStyle = "#6b7cff";
    targetCtx.fillRect(12, 7, 2, 2);
    targetCtx.fillRect(16, 7, 2, 2);
    targetCtx.fillRect(11, 8, 8, 2);
    targetCtx.fillRect(12, 10, 6, 1);
    targetCtx.fillRect(14, 11, 2, 1);

    // キラキラ（ちょっとくっきり目印ver）
    targetCtx.fillStyle = "#263b55";
    targetCtx.fillRect(19, 19, 8, 4);
    targetCtx.fillRect(21, 17, 4, 8);

    targetCtx.fillStyle = "#ffd85c";
    targetCtx.fillRect(20, 20, 6, 2);
    targetCtx.fillRect(22, 18, 2, 6);
  }

  targetCtx.restore();
}

function draw() {
  drawBackground();

  drawKspoDome();

  obstacles.forEach(o => drawObstacle(o, ctx));
  items.forEach(item => drawItem(item, ctx));

  drawPlayer();

  // 加速中の表示
  if (boostTimer > 0 && state === "running") {
    ctx.fillStyle = "#6b7cff";
    ctx.font = '28px "Jersey 10", Arial';
    ctx.textAlign = "left";
    ctx.fillText("SPEED UP!", 20, 35);
  }

  if (hitFlash > 0) {
    ctx.fillStyle = "rgba(255,80,80,0.18)";
    ctx.fillRect(0, 0, W, H);
  }

  if (state === "ready") {
    ctx.fillStyle = "#263b55";
    ctx.font = '42px "Jersey 10", Arial';
    ctx.textAlign = "center";
    ctx.fillText("READY TO RUN?", W / 2, 125);
  }

  if (state === "paused") {
    ctx.fillStyle = "rgba(38,59,85,0.55)";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#ffffff";
    ctx.font = '48px "Jersey 10", Arial';
    ctx.textAlign = "center";
    ctx.fillText("PAUSED", W / 2, 170);
  }

if (state === "finished") {
  ctx.fillStyle = "rgba(38,59,85,0.55)";
  ctx.fillRect(0, 0, W, H);

  // 紙吹雪
  const confetti = [
    [80, 65, "#ff9ab8"], [145, 115, "#ffffff"], [220, 55, "#6b7cff"],
    [285, 90, "#ffd36e"], [360, 45, "#ff9ab8"], [440, 105, "#ffffff"],
    [520, 55, "#6b7cff"], [600, 95, "#ffd36e"], [700, 50, "#ff9ab8"],
    [750, 125, "#ffffff"], [110, 210, "#6b7cff"], [260, 235, "#ff9ab8"],
    [540, 220, "#ffd36e"], [680, 205, "#6b7cff"]
  ];
  confetti.forEach(([x, y, color]) => {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, 8, 12);
  });

  // キラキラ
  const sparkles = [
    [170, 75], [315, 165], [490, 65],
    [650, 145], [730, 230], [75, 155]
  ];
  sparkles.forEach(([x, y]) => {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x - 2, y - 9, 4, 18);
    ctx.fillRect(x - 9, y - 2, 18, 4);
  });

  // 大きなRESULTパネル
  ctx.fillStyle = "#263b55";
  ctx.fillRect(130, 20, 540, 320);

  ctx.fillStyle = "#dff1ff";
  ctx.fillRect(136, 26, 528, 308);

  // タイトル帯
  ctx.fillStyle = "#6b7cff";
  ctx.fillRect(136, 26, 528, 52);

  ctx.textAlign = "center";
  ctx.font = '50px "Jersey 10", Arial';
  ctx.fillStyle = "#ffffff";
  ctx.fillText("GOAL!", W / 2, 68);

  // サブタイトル
  ctx.font = '22px "Jersey 10", Arial';
  ctx.fillStyle = "#526a91";
  ctx.fillText("WELCOME TO KSPO DOME!", W / 2, 102);

  // WELCOME〜と4分割カードの間に横長RUNNERカード
  drawStatCard(ctx, 160, 112, 480, 54, "RUNNER", getSelectedRunnerLabel(), "#6b7cff", false);

  // 4つの記録カード
  drawStatCard(ctx, 160, 174, 226, 66, "TIME", formatTime(elapsed), "#ff9ab8", false);
  drawStatCard(ctx, 414, 174, 226, 66, "SCORE", score, "#9b8cff", false);
  drawStatCard(ctx, 160, 248, 226, 66, "ITEMS", collectedCount, "#55a9df", false);
  drawStatCard(ctx, 414, 248, 226, 66, "뛰어!", jumpCount, "#ff9ab8", true);
 }
}

async function finishGame() {
  state = "finished";

  message.textContent = "YOU MADE IT! CONGRATULATIONS!";

  startBtn.textContent = "RETRY";
  startBtn.style.display = "inline-block";

  pauseBtn.style.display = "none";

  if (shareArea) {
    shareArea.style.display = "block";
  }

  try {
    if (document.fonts) {
      await document.fonts.load('22px "Mulmaru"', "뛰어!");
      await document.fonts.ready;
    }
  } catch (e) {
    console.warn("フォント読み込み待機スキップ:", e);
  }

  draw();
  generateShareImage();
}

function loop(now) {
  if (state !== "running") return;

  const rawDt = (now - lastTime) / 1000;
  const dt = Math.max(0, Math.min(rawDt, 0.04));

  lastTime = now;

  update(dt);
  draw();

  if (state === "running") {
    requestAnimationFrame(loop);
  }
}
  function generateShareImage() {
  try {
    const shareCanvas = document.createElement("canvas");
    shareCanvas.width = 1200;
    shareCanvas.height = 630;
    const sCtx = shareCanvas.getContext("2d");

    // 背景（淡い水色＋ドット枠）
    sCtx.fillStyle = "#e6f2fb";
    sCtx.fillRect(0, 0, 1200, 630);

    sCtx.fillStyle = "#ffffff";
    sCtx.fillRect(28, 28, 1144, 574);

    sCtx.fillStyle = "#dff1ff";
    sCtx.fillRect(36, 36, 1128, 558);

    // 上部タイトル
    sCtx.textAlign = "center";
    sCtx.font = '64px "Jersey 10", Arial';
    sCtx.fillStyle = "#6b7cff";
    sCtx.fillText("ROAD TO KSPO DOME", 600, 102);

    // 左側：3人ニコニコジャンプ（くっつけて配置）
    drawThreeJumpers(sCtx, 315, 500, 190);


    sCtx.textAlign = "center";
    sCtx.font = '32px "Jersey 10", Arial';
    sCtx.fillStyle = "#ff7eb6";
    sCtx.fillText("YOU MADE IT! CONGRATULATIONS!", 315, 546);

    // 右側：GOALパネル（WELCOME〜の下に横長RUNNER、その下に4分割カード）
    const px = 590, py = 132, pw = 540, ph = 420;
    sCtx.fillStyle = "#263b55";
    sCtx.fillRect(px, py, pw, ph);

    sCtx.fillStyle = "#dff1ff";
    sCtx.fillRect(px + 6, py + 6, pw - 12, ph - 12);

    sCtx.fillStyle = "#6b7cff";
    sCtx.fillRect(px + 6, py + 6, pw - 12, 62);

    sCtx.fillStyle = "#ffffff";
    sCtx.font = '54px "Jersey 10", Arial';
    sCtx.fillText("GOAL!", px + pw / 2, py + 54);

    sCtx.fillStyle = "#526a91";
    sCtx.font = '26px "Jersey 10", Arial';
    sCtx.fillText("WELCOME TO KSPO DOME!", px + pw / 2, py + 102);

    // 横長RUNNERカード
    drawStatCard(sCtx, px + 26, py + 116, pw - 52, 64, "RUNNER", getSelectedRunnerLabel(), "#6b7cff", false);

    // 4分割カード
    const cw = 236, ch = 92;
    const leftX = px + 26;
    const rightX = px + pw - 26 - cw;
    const row1Y = py + 192;
    const row2Y = py + 298;

    drawStatCard(sCtx, leftX,  row1Y, cw, ch, "TIME",  formatTime(elapsed), "#ff9ab8", false);
    drawStatCard(sCtx, rightX, row1Y, cw, ch, "SCORE", score,               "#9b8cff", false);
    drawStatCard(sCtx, leftX,  row2Y, cw, ch, "ITEMS", collectedCount,      "#55a9df", false);
    drawStatCard(sCtx, rightX, row2Y, cw, ch, "뛰어!", jumpCount,           "#ff9ab8", true);

    latestShareDataUrl = shareCanvas.toDataURL("image/png");

    const imgEl = document.getElementById("resultCardImg");
    if (imgEl) {
      imgEl.src = latestShareDataUrl;
      imgEl.style.display = "block";
    }
    } catch (err) {
    console.error("シェア画像生成エラー:", err);
  }
  }

const shareArea = document.getElementById("shareArea");
const shareXBtn = document.getElementById("shareXBtn");
const saveImgBtn = document.getElementById("saveImgBtn");

if (saveImgBtn) {
  saveImgBtn.addEventListener("click", () => {
    if (!latestShareDataUrl) {
      generateShareImage();
    }
    if (!latestShareDataUrl) 
      return;

    const link = document.createElement("a");
    link.href = latestShareDataUrl;
    link.download = `road-to-kspo-${getSelectedRunnerLabel().toLowerCase()}.png`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });
}

if (shareXBtn) {
  shareXBtn.addEventListener("click", () => {
    const runner = getSelectedRunnerLabel();
    const gameUrl = "https://mii622.github.io/road-to-kspo/";
    const tweetText = [
      `GOAL! Cleared with ${runner}! 🎉`,
      `SCORE: ${score} | TIME: ${formatTime(elapsed)}`,
      ``,
      `#ROADTOKSPODOME #CNBLUE #씨엔블루 #에바뛰콘`,
      ``,
      `${gameUrl}`
    ].join("\n");

    const intentUrl =
      "https://twitter.com/intent/tweet" +
      `?text=${encodeURIComponent(tweetText)}`;

    window.location.href = intentUrl;
  });
}

updateInfo();
draw();

</script>
