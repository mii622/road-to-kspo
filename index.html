<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROAD TO KSPO DOME</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #eaf3fa;
  color: #263b55;
  font-family: "Jersey 10", Arial, sans-serif;
  text-align: center;
}

header {
  padding: 20px 10px 5px;
}

h1 {
  color: #6b7cff;
  font-family: "Jersey 10", sans-serif;
  font-size: 48px;
  letter-spacing: 2px;
  line-height: 1;
  margin: 5px 0;
  text-shadow: 3px 3px 0 #ffb5d0;
}

.small {
  font-family: "Jersey 10", sans-serif;
  font-size: 19px;
  letter-spacing: 1px;
  color: #71849a;
}

#game {
  width: 100%;
  max-width: 800px;
  margin: 10px auto;
  padding: 0 10px;
}

#info {
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 0;
  font-family: "Jersey 10", sans-serif;
  font-size: 22px;
  letter-spacing: 1px;
  color: #526a91;
}

#info span span {
  color: #6b7cff;
  font-size: 25px;
}

#progress {
  width: 100%;
  height: 13px;
  background: #d0dfeb;
  border: 2px solid #afcbda;
  border-radius: 3px;
  overflow: hidden;
  margin: 5px 0 10px;
}

#progressBar {
  height: 100%;
  width: 0%;
  background: repeating-linear-gradient(
    90deg,
    #6b7cff 0px,
    #6b7cff 12px,
    #9b8cff 12px,
    #9b8cff 16px
  );
  transition: width 0.1s linear;
}

canvas {
  width: 100%;
  display: block;
  background: #dff1ff;
  border: 4px solid #afcbda;
  border-radius: 5px;
  box-shadow: 5px 5px 0 #c7d7e8;
  touch-action: none;
}

#message {
  padding: 12px 5px;
  min-height: 45px;
  font-family: "Jersey 10", sans-serif;
  font-size: 23px;
  letter-spacing: 1px;
  color: #6b7cff;
}

button {
  background: #6b7cff;
  color: white;
  border: 3px solid #263b55;
  border-radius: 4px;
  box-shadow: 4px 4px 0 #263b55;
  padding: 10px 42px;
  font-family: "Jersey 10", sans-serif;
  font-size: 27px;
  letter-spacing: 1px;
  cursor: pointer;
  margin: 8px;
}

button:active {
  transform: translate(3px, 3px);
  box-shadow: 1px 1px 0 #263b55;
}

#pause {
  background: #ff9ab8;
  display: none;
  padding: 10px 30px;
}

.small {
  margin-top: 12px;
}
</style>
</head>

<body>

<header>
  <h1>ROAD TO KSPO DOME</h1>
  <div class="small">RUN TO YOUR FAVORITE STAGE!</div>
</header>

<div id="game">

  <div id="info">
    <span>SCORE: <span id="score">0</span></span>
    <span>TIME: <span id="time">00:00</span></span>
    <span>DISTANCE: <span id="distance">0%</span></span>
  </div>

  <div id="progress">
    <div id="progressBar"></div>
  </div>

  <canvas id="canvas" width="800" height="360"></canvas>

  <div id="message">LET'S RUN TO KSPO DOME!</div>

  <button id="start">START</button>
  <button id="pause">PAUSE</button>
  
<p class="small">TAP TO JUMP!</p>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const distanceEl = document.getElementById("distance");
const progressBar = document.getElementById("progressBar");
const message = document.getElementById("message");
const startBtn = document.getElementById("start");
const pauseBtn = document.getElementById("pause");

const W = 800;
const H = 360;
const ground = 285;

// ゴールまでの距離
const TOTAL_DISTANCE = 18000;

// 基本スピード
const SPEED_EARLY = 300;
const SPEED_MIDDLE = 340;
const SPEED_LATE = 380;

// アイテム取得時の加速
const BOOST_AMOUNT = 30;
const BOOST_DURATION = 3;

let state = "ready";
let score = 0;
let elapsed = 0;
let distance = 0;
let lastTime = 0;

let obstacles = [];
let items = [];

let spawnTimer = 0;
let itemTimer = 0;
let hitFlash = 0;

let hitCount = 0;
let collectedCount = 0;
let jumpCount = 0;

// 加速残り時間
let boostTimer = 0;

let runAnimationTime = 0;

const player = {
  x: 110,
  y: ground - 52,
  w: 36,
  h: 52,
  vy: 0,
  jumping: false
};

function formatTime(seconds) {
  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);

  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0")
  );
}

function resetGame() {
  score = 0;
  elapsed = 0;
  distance = 0;

  obstacles = [];
  items = [];

  spawnTimer = 1.8;
  itemTimer = 1.5;

  hitFlash = 0;
  hitCount = 0;
  collectedCount = 0;
  jumpCount = 0;
  boostTimer = 0;

  player.y = ground - player.h;
  player.vy = 0;
  player.jumping = false;

  updateInfo();
}

function startGame() {
  resetGame();

  state = "running";

  message.textContent = "GO! RUN TO KSPO!";

  startBtn.style.display = "none";
  pauseBtn.style.display = "inline-block";
  pauseBtn.textContent = "PAUSE";

  lastTime = performance.now();

  requestAnimationFrame(loop);
}

function togglePause() {
  if (state === "running") {
    state = "paused";

    message.textContent = "PAUSED";
    pauseBtn.textContent = "RESUME";

    draw();

  } else if (state === "paused") {
    state = "running";

    message.textContent = "GO! RUN TO KSPO!";
    pauseBtn.textContent = "PAUSE";

    lastTime = performance.now();

    requestAnimationFrame(loop);
  }
}

  function jump() {
  if (state !== "running") return;
  if (player.jumping) return;

  player.vy = -650;
  player.jumping = true;

  jumpCount++;
  }

canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  jump();
});

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    jump();
  }
});

startBtn.addEventListener("click", startGame);
pauseBtn.addEventListener("click", togglePause);

function updateInfo() {
  scoreEl.textContent = score;
  timeEl.textContent = formatTime(elapsed);

  const percent = Math.min(
    100,
    (distance / TOTAL_DISTANCE) * 100
  );

  distanceEl.textContent = Math.floor(percent) + "%";
  progressBar.style.width = percent + "%";
}

// 進行度に応じた基本スピード
function getBaseSpeed() {
  const progress = distance / TOTAL_DISTANCE;

  if (progress < 1 / 3) {
    return SPEED_EARLY;
  }

  if (progress < 2 / 3) {
    return SPEED_MIDDLE;
  }

  return SPEED_LATE;
}

// 現在のスピード
function getSpeed() {
  return getBaseSpeed() +
    (boostTimer > 0 ? BOOST_AMOUNT : 0);
}

// アイテム取得時の加速
function activateBoost() {
  boostTimer = BOOST_DURATION;
}


function spawnObstacle() {
  const spawnX = W + 20;

  // ゴールまで残り約4秒になったら新しい障害物を出さない
  const remainingDistance = TOTAL_DISTANCE - distance;

  if (remainingDistance <= getSpeed() * 4) {
    return false;
  }

  // アイテムの近くには障害物を出さない
  const blocked = items.some(item =>
    Math.abs(item.x - spawnX) < 220
  );

  if (blocked) return false;

  const types = [
    { name: "CASE", w: 48, h: 55 },
    { name: "CABLE", w: 65, h: 18 },
    { name: "BARRIER", w: 55, h: 65 }
  ];

  const type = types[
    Math.floor(Math.random() * types.length)
  ];

  obstacles.push({
    x: spawnX,
    y: ground - type.h,
    w: type.w,
    h: type.h,
    name: type.name,
    passed: false
  });

  return true;
}


function spawnItem() {
  const spawnX = W + 20;

  const obstacleNearby = obstacles.some(o =>
    Math.abs(o.x - spawnX) < 220
  );

  const itemNearby = items.some(item =>
    Math.abs(item.x - spawnX) < 130
  );

  if (obstacleNearby || itemNearby) return false;

  const types = [
    { name: "BOTTLE", points: 100, color: "#55a9df" },
    { name: "TOWEL", points: 150, color: "#ff9ab8" },
    { name: "FLAG", points: 200, color: "#6b7cff" }
  ];

  const type = types[
    Math.floor(Math.random() * types.length)
  ];

 const remainingDistance = TOTAL_DISTANCE - distance;
const isNearGoal = remainingDistance <= getSpeed() * 2;

let y;

if (isNearGoal) {
  y = ground - 20;
} else {
  const r = Math.random();

  if (r < 0.35) y = ground - 20;
  else if (r < 0.70) y = ground - 45;
  else y = ground - 140;
}

  items.push({
    x: spawnX,
    y: y,
    w: 25,
    h: 25,
    points: type.points,
    name: type.name,
    color: type.color
  });

  return true;
}

function overlap(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function update(dt) {
  elapsed += dt;
  if (!player.jumping) {
  runAnimationTime += dt;
  }

  // 加速時間を減らす
  if (boostTimer > 0) {
    boostTimer = Math.max(0, boostTimer - dt);
  }

  const speed = getSpeed();

  // 距離を進める
  distance += speed * dt;

  // ゴール到着
  // ドームの入口に到着したらゴール
const remainingDistance = TOTAL_DISTANCE - distance;

if (remainingDistance <= 50) {
  distance = TOTAL_DISTANCE;
  updateInfo();
  finishGame();
  return;
}

  // ジャンプ
  player.vy += 1700 * dt;
  player.y += player.vy * dt;

  if (player.y >= ground - player.h) {
    player.y = ground - player.h;
    player.vy = 0;
    player.jumping = false;
  }

  // 障害物出現
  spawnTimer -= dt;

  if (spawnTimer <= 0) {
    const spawned = spawnObstacle();

    spawnTimer = spawned
      ? 2.0 + Math.random() * 0.8
      : 0.25;
  }

  obstacles.forEach(o => {
    o.x -= speed * dt;

    if (!o.passed && overlap(player, o)) {
      score = Math.max(0, score - 100);
      o.passed = true;
      hitCount++;
      hitFlash = 0.2;
    }
  });

  obstacles = obstacles.filter(o =>
    o.x + o.w > 0
  );

  // アイテム出現
  itemTimer -= dt;

  if (itemTimer <= 0) {
    const spawned = spawnItem();

    itemTimer = spawned
      ? 1.5 + Math.random() * 1.0
      : 0.25;
  }

  items.forEach(item => {
    item.x -= speed * dt;

    // 横方向に少し取得判定を広げる
    const itemHitbox = {
      x: item.x - 8,
      y: item.y,
      w: item.w + 16,
      h: item.h
    };

    if (overlap(player, itemHitbox)) {
      score += item.points;
      item.collected = true;
      collectedCount++;

      // アイテム取得で一時加速
      activateBoost();
    }
  });

  items = items.filter(item =>
    item.x + item.w > 0 && !item.collected
  );

  hitFlash = Math.max(0, hitFlash - dt);

  updateInfo();
}

function drawBackground() {
  ctx.fillStyle = "#dff1ff";
  ctx.fillRect(0, 0, W, H);

  // 雲
  ctx.fillStyle = "#ffffff";

  for (let i = 0; i < 5; i++) {
    const x = (
      i * 190 - distance * 0.07
    ) % 950;

    ctx.beginPath();
    ctx.arc(x, 75, 22, 0, Math.PI * 2);
    ctx.arc(x + 25, 70, 28, 0, Math.PI * 2);
    ctx.arc(x + 50, 78, 20, 0, Math.PI * 2);
    ctx.fill();
  }

  // 街並み
  for (let i = 0; i < 9; i++) {
    const x = (
      i * 110 - distance * 0.15
    ) % 1000;

    ctx.fillStyle = "#afcbda";
    ctx.fillRect(x, 180, 65, 105);

    ctx.fillStyle = "#eaf3fa";

    for (let j = 0; j < 3; j++) {
      ctx.fillRect(x + 12, 195 + j * 25, 12, 12);
      ctx.fillRect(x + 38, 195 + j * 25, 12, 12);
    }
  }

  // 地面
  ctx.fillStyle = "#8ab4a0";
  ctx.fillRect(0, ground, W, H - ground);

  ctx.fillStyle = "#ffffff";

  for (let i = 0; i < 15; i++) {
    const x = (
      i * 75 - distance * 0.7
    ) % 850;

    ctx.fillRect(x, ground + 35, 35, 5);
  }
}


function drawKspoDome() {
  const remainingDistance = TOTAL_DISTANCE - distance;
  const speed = getSpeed();

  // ゴールまで残り約4秒になったら登場
  if (remainingDistance > speed * 4) return;

  // 近づくほど大きく、左に移動する
  const progress = Math.max(
    0,
    Math.min(1, 1 - remainingDistance / (speed * 4))
  );

  const x = 680 - progress * 600;
  const scale = 0.55 + progress * 0.65;

  ctx.save();
  ctx.translate(x, ground);
  ctx.scale(scale, scale);

  // ドーム外側
  ctx.fillStyle = "#263b55";
  ctx.fillRect(20, -75, 180, 75);

  // 屋根の段差
  ctx.fillRect(40, -88, 140, 13);
  ctx.fillRect(60, -98, 100, 10);
  ctx.fillRect(80, -105, 60, 7);

  // ドーム本体
  ctx.fillStyle = "#afcbda";
  ctx.fillRect(25, -70, 170, 70);

  // 屋根の内側
  ctx.fillStyle = "#71849a";
  ctx.fillRect(45, -82, 130, 12);
  ctx.fillRect(65, -92, 90, 10);
  ctx.fillRect(85, -99, 50, 7);

  // 正面の壁
  ctx.fillStyle = "#dff1ff";
  ctx.fillRect(40, -58, 140, 58);

  // 窓
  ctx.fillStyle = "#6b7cff";
  ctx.fillRect(50, -48, 18, 25);
  ctx.fillRect(75, -48, 18, 25);
  ctx.fillRect(145, -48, 18, 25);
  ctx.fillRect(170, -48, 5, 25);

  // 入り口
  ctx.fillStyle = "#263b55";
  ctx.fillRect(105, -42, 30, 42);

  // 看板
  ctx.fillStyle = "#6b7cff";
  ctx.fillRect(75, -65, 70, 13);

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 9px Arial";
  ctx.textAlign = "center";
  ctx.fillText("KSPO DOME", 110, -55);

  // 地面との境目
  ctx.fillStyle = "#263b55";
  ctx.fillRect(15, -3, 190, 3);

  ctx.restore();
}

function drawPlayer() {
  const x = player.x;
  const y = player.y;

  // ドット絵の頭・顔
  ctx.fillStyle = "#343b4c";

  // 髪
  ctx.fillRect(x + 7, y + 1, 22, 5);
  ctx.fillRect(x + 4, y + 6, 28, 7);
  ctx.fillRect(x + 7, y + 13, 24, 3);
  ctx.fillRect(x + 4, y + 6, 4, 7);

  // 顔
  ctx.fillStyle = "#f1c9a5";
  ctx.fillRect(x + 9, y + 8, 18, 14);
  ctx.fillRect(x + 12, y + 5, 12, 3);

  // 前髪
  ctx.fillStyle = "#343b4c";
  ctx.fillRect(x + 8, y + 5, 5, 5);
  ctx.fillRect(x + 14, y + 5, 6, 3);
  ctx.fillRect(x + 23, y + 6, 5, 4);

  // 目
  ctx.fillStyle = "#263b55";
  ctx.fillRect(x + 13, y + 13, 3, 3);
  ctx.fillRect(x + 23, y + 13, 3, 3);

  // ライブTシャツ
  ctx.fillStyle = "#6b7cff";
  ctx.fillRect(x + 5, y + 23, 26, 19);
  ctx.fillRect(x + 1, y + 24, 5, 10);
  ctx.fillRect(x + 30, y + 24, 5, 10);

  // シャツの柄
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(x + 12, y + 29, 12, 3);
  ctx.fillRect(x + 15, y + 34, 6, 2);

  // 足の動き
  let leftLegX = 0;
  let rightLegX = 0;

  if (state === "running" && !player.jumping) {
    const swing = Math.sin(runAnimationTime * 14);

    leftLegX = Math.round(swing * 4);
    rightLegX = Math.round(-swing * 4);
  }

  // 左足
  ctx.fillStyle = "#263b55";
  ctx.fillRect(x + 10 + leftLegX, y + 42, 5, 7);
  ctx.fillRect(x + 8 + leftLegX, y + 49, 8, 3);

  // 右足
  ctx.fillRect(x + 23 + rightLegX, y + 42, 5, 7);
  ctx.fillRect(x + 23 + rightLegX, y + 49, 8, 3);
}


function drawObstacle(o) {
  const x = Math.round(o.x);
  const y = Math.round(o.y);

  // 機材ケース
  if (o.name === "CASE") {
    // 外枠
    ctx.fillStyle = "#263b55";
    ctx.fillRect(x, y, 48, 55);

    // ケース本体
    ctx.fillStyle = "#71849a";
    ctx.fillRect(x + 4, y + 4, 40, 47);

    // 中央パネル
    ctx.fillStyle = "#afcbda";
    ctx.fillRect(x + 9, y + 10, 30, 29);

    // パネルの色
    ctx.fillStyle = "#48566b";
    ctx.fillRect(x + 12, y + 13, 24, 23);

    // 留め具
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x + 3, y + 20, 4, 8);
    ctx.fillRect(x + 41, y + 20, 4, 8);

    // 持ち手
    ctx.fillStyle = "#263b55";
    ctx.fillRect(x + 15, y, 18, 5);
    ctx.fillStyle = "#afcbda";
    ctx.fillRect(x + 19, y + 1, 10, 3);

    // 下の角
    ctx.fillStyle = "#263b55";
    ctx.fillRect(x + 4, y + 48, 8, 7);
    ctx.fillRect(x + 36, y + 48, 8, 7);
  }

  // ケーブル
  else if (o.name === "CABLE") {
    // ドット状に波打つケーブル
    ctx.fillStyle = "#263b55";

    ctx.fillRect(x, y + 5, 10, 8);
    ctx.fillRect(x + 9, y, 10, 8);
    ctx.fillRect(x + 18, y + 5, 10, 8);
    ctx.fillRect(x + 27, y + 9, 10, 8);
    ctx.fillRect(x + 36, y + 5, 10, 8);
    ctx.fillRect(x + 45, y, 10, 8);
    ctx.fillRect(x + 54, y + 5, 11, 8);

    // ケーブルのハイライト
    ctx.fillStyle = "#71849a";
    ctx.fillRect(x + 3, y + 7, 5, 3);
    ctx.fillRect(x + 12, y + 2, 5, 3);
    ctx.fillRect(x + 30, y + 11, 5, 3);
    ctx.fillRect(x + 48, y + 2, 5, 3);
  }

  // バリケード
  else if (o.name === "BARRIER") {
    // 外枠
    ctx.fillStyle = "#263b55";
    ctx.fillRect(x, y + 3, 55, 43);

    // 本体
    ctx.fillStyle = "#e58b75";
    ctx.fillRect(x + 3, y + 6, 49, 37);

    // 白い警告ライン
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x + 7, y + 13, 9, 8);
    ctx.fillRect(x + 23, y + 13, 9, 8);
    ctx.fillRect(x + 39, y + 13, 9, 8);

    // 脚
    ctx.fillStyle = "#263b55";
    ctx.fillRect(x + 7, y + 43, 9, 22);
    ctx.fillRect(x + 39, y + 43, 9, 22);

    // 脚の足元
    ctx.fillStyle = "#71849a";
    ctx.fillRect(x + 3, y + 61, 17, 4);
    ctx.fillRect(x + 35, y + 61, 17, 4);
  }
}



function drawItem(item) {
  const x = Math.round(item.x);
  const y = Math.round(item.y);

  ctx.save();

  // アイテムを中心から1.25倍に拡大
  ctx.translate(x, y);
  ctx.scale(1.25, 1.25);

  // ペットボトル
  if (item.name === "BOTTLE") {
    ctx.fillStyle = "#263b55";
    ctx.fillRect(10, 1, 7, 4);
    ctx.fillRect(6, 4, 15, 20);

    ctx.fillStyle = "#55a9df";
    ctx.fillRect(8, 6, 11, 16);

    ctx.fillStyle = "#dff1ff";
    ctx.fillRect(10, 8, 3, 8);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(8, 15, 11, 4);
  }

  // タオル
  else if (item.name === "TOWEL") {
    ctx.fillStyle = "#263b55";
    ctx.fillRect(1, 6, 24, 15);

    ctx.fillStyle = "#ff9ab8";
    ctx.fillRect(3, 5, 20, 13);

    ctx.fillStyle = "#ffd6e2";
    ctx.fillRect(5, 8, 16, 3);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(4, 16, 3, 2);
    ctx.fillRect(10, 16, 3, 2);
    ctx.fillRect(16, 16, 3, 2);
  }

  // 旗
  else if (item.name === "FLAG") {
    ctx.fillStyle = "#263b55";
    ctx.fillRect(5, 2, 3, 23);
    ctx.fillRect(8, 2, 15, 13);

    ctx.fillStyle = "#6b7cff";
    ctx.fillRect(10, 4, 11, 9);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(13, 6, 5, 2);
    ctx.fillRect(14, 9, 3, 2);

    ctx.fillStyle = "#263b55";
    ctx.fillRect(3, 23, 7, 2);
  }

  ctx.restore();
}


function draw() {
  drawBackground();

  drawKspoDome();

  obstacles.forEach(drawObstacle);
  items.forEach(drawItem);

  drawPlayer();

  // 加速中の表示
  if (boostTimer > 0 && state === "running") {
    ctx.fillStyle = "#6b7cff";
    ctx.font = "bold 20px Arial";
    ctx.textAlign = "left";
    ctx.fillText("SPEED UP!", 20, 35);
  }

  if (hitFlash > 0) {
    ctx.fillStyle = "rgba(255,80,80,0.18)";
    ctx.fillRect(0, 0, W, H);
  }

  if (state === "ready") {
    ctx.fillStyle = "#263b55";
    ctx.font = "bold 32px Arial";
    ctx.textAlign = "center";
    ctx.fillText("READY TO RUN?", W / 2, 125);
  }

  if (state === "paused") {
    ctx.fillStyle = "rgba(38,59,85,0.55)";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 40px Arial";
    ctx.textAlign = "center";
    ctx.fillText("PAUSED", W / 2, 170);
  }

 

 if (state === "finished") {
  // 背景
  ctx.fillStyle = "rgba(38,59,85,0.55)";
  ctx.fillRect(0, 0, W, H);

  // 紙吹雪
  const confetti = [
    [80, 65, "#ff9ab8"],
    [145, 115, "#ffffff"],
    [220, 55, "#6b7cff"],
    [285, 90, "#ffd36e"],
    [360, 45, "#ff9ab8"],
    [440, 105, "#ffffff"],
    [520, 55, "#6b7cff"],
    [600, 95, "#ffd36e"],
    [700, 50, "#ff9ab8"],
    [750, 125, "#ffffff"],
    [110, 210, "#6b7cff"],
    [260, 235, "#ff9ab8"],
    [540, 220, "#ffd36e"],
    [680, 205, "#6b7cff"]
  ];

  confetti.forEach(([x, y, color]) => {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, 8, 12);
  });

  // キラキラ
  const sparkles = [
    [170, 75], [315, 165], [490, 65],
    [650, 145], [730, 230], [75, 155]
  ];

  sparkles.forEach(([x, y]) => {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x - 2, y - 9, 4, 18);
    ctx.fillRect(x - 9, y - 2, 18, 4);
  });

  // RESULTパネル
  ctx.fillStyle = "#263b55";
  ctx.fillRect(174, 57, 452, 248);

  ctx.fillStyle = "#dff1ff";
  ctx.fillRect(180, 63, 440, 236);

  // 上部タイトル帯
  ctx.fillStyle = "#6b7cff";
  ctx.fillRect(180, 63, 440, 53);

  ctx.textAlign = "center";

  ctx.font = '48px "Jersey 10", Arial';
  ctx.fillStyle = "#ffffff";
  ctx.fillText("GOAL!", W / 2, 103);

  // サブタイトル
  ctx.font = '24px "Jersey 10", Arial';
  ctx.fillStyle = "#526a91";
  ctx.fillText("WELCOME TO KSPO DOME!", W / 2, 145);

  // 記録カード
  const cards = [
    { x: 205, y: 165, label: "TIME", value: formatTime(elapsed), color: "#ff9ab8" },
    { x: 410, y: 165, label: "SCORE", value: score, color: "#9b8cff" },
    { x: 205, y: 230, label: "ITEMS", value: collectedCount, color: "#55a9df" },
    { x: 410, y: 230, label: "뛰어!", value: jumpCount, color: "#ff9ab8" }
  ];

  cards.forEach(card => {
    ctx.fillStyle = "#afcbda";
    ctx.fillRect(card.x, card.y, 185, 55);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(card.x + 3, card.y + 3, 179, 49);

    ctx.fillStyle = card.color;
    ctx.fillRect(card.x + 3, card.y + 3, 5, 49);

    ctx.textAlign = "left";

    ctx.font = '21px "Jersey 10", Arial';
    ctx.fillStyle = "#71849a";
    ctx.fillText(card.label, card.x + 17, card.y + 21);

    ctx.font = '30px "Jersey 10", Arial';
    ctx.fillStyle = "#263b55";
    ctx.fillText(String(card.value), card.x + 17, card.y + 47);
  });
 }
｝
function finishGame() {
  state = "finished";

  message.textContent = "YOU MADE IT! CONGRATULATIONS!";

  startBtn.textContent = "RETRY";
  startBtn.style.display = "inline-block";

  pauseBtn.style.display = "none";

  draw();
}

function loop(now) {
  if (state !== "running") return;

  const dt = Math.min(
    (now - lastTime) / 1000,
    0.04
  );

  lastTime = now;

  update(dt);
  draw();

  if (state === "running") {
    requestAnimationFrame(loop);
  }
}

updateInfo();
draw();

</script>
