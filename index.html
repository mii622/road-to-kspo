<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROAD TO KSPO</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #eaf3fa;
  color: #263b55;
  font-family: Arial, sans-serif;
  text-align: center;
}

header { padding: 20px 10px 5px; }

h1 {
  color: #6b7cff;
  letter-spacing: 2px;
  margin-bottom: 5px;
}

#game {
  width: 100%;
  max-width: 800px;
  margin: 10px auto;
  padding: 0 10px;
}

#info {
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 0;
  font-weight: bold;
  font-size: 14px;
}

canvas {
  width: 100%;
  display: block;
  background: #dff1ff;
  border: 3px solid #afcbda;
  border-radius: 12px;
  touch-action: none;
}

#progress {
  width: 100%;
  height: 9px;
  background: #d0dfeb;
  border-radius: 10px;
  overflow: hidden;
  margin: 5px 0 10px;
}

#progressBar {
  height: 100%;
  width: 0%;
  background: #6b7cff;
  border-radius: 10px;
  transition: width 0.1s linear;
}

button {
  background: #6b7cff;
  color: white;
  border: none;
  border-radius: 30px;
  padding: 13px 40px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin: 5px;
}

#pause {
  background: #71849a;
  display: none;
  padding: 13px 30px;
}

#message {
  padding: 12px;
  min-height: 45px;
}

.small {
  font-size: 12px;
  color: #71849a;
}
</style>
</head>

<body>

<header>
  <h1>ROAD TO KSPO</h1>
  <div class="small">RUN TO YOUR FAVORITE STAGE!</div>
</header>

<div id="game">

  <div id="info">
    <span>SCORE: <span id="score">0</span></span>
    <span>TIME: <span id="time">00:00</span></span>
    <span>DISTANCE: <span id="distance">0%</span></span>
  </div>

  <div id="progress">
    <div id="progressBar"></div>
  </div>

  <canvas id="canvas" width="800" height="360"></canvas>

  <div id="message">KSPO DOMEを目指して走ろう！</div>

  <button id="start">START</button>
  <button id="pause">PAUSE</button>

  <p class="small">画面をタップしてジャンプ！</p>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const distanceEl = document.getElementById("distance");
const progressBar = document.getElementById("progressBar");
const message = document.getElementById("message");
const startBtn = document.getElementById("start");
const pauseBtn = document.getElementById("pause");

const W = 800;
const H = 360;
const ground = 285;

// ゴールまでの距離
const TOTAL_DISTANCE = 18000;

// 基本スピード
const SPEED_EARLY = 300;
const SPEED_MIDDLE = 340;
const SPEED_LATE = 380;

// アイテム取得時の加速
const BOOST_AMOUNT = 30;
const BOOST_DURATION = 3;

let state = "ready";
let score = 0;
let elapsed = 0;
let distance = 0;
let lastTime = 0;

let obstacles = [];
let items = [];

let spawnTimer = 0;
let itemTimer = 0;
let hitFlash = 0;

let hitCount = 0;
let collectedCount = 0;

// 加速残り時間
let boostTimer = 0;

const player = {
  x: 110,
  y: ground - 52,
  w: 36,
  h: 52,
  vy: 0,
  jumping: false
};

function formatTime(seconds) {
  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);

  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0")
  );
}

function resetGame() {
  score = 0;
  elapsed = 0;
  distance = 0;

  obstacles = [];
  items = [];

  spawnTimer = 1.8;
  itemTimer = 1.5;

  hitFlash = 0;
  hitCount = 0;
  collectedCount = 0;
  boostTimer = 0;

  player.y = ground - player.h;
  player.vy = 0;
  player.jumping = false;

  updateInfo();
}

function startGame() {
  resetGame();

  state = "running";

  message.textContent = "GO! RUN TO KSPO!";

  startBtn.style.display = "none";
  pauseBtn.style.display = "inline-block";
  pauseBtn.textContent = "PAUSE";

  lastTime = performance.now();

  requestAnimationFrame(loop);
}

function togglePause() {
  if (state === "running") {
    state = "paused";

    message.textContent = "PAUSED";
    pauseBtn.textContent = "RESUME";

    draw();

  } else if (state === "paused") {
    state = "running";

    message.textContent = "GO! RUN TO KSPO!";
    pauseBtn.textContent = "PAUSE";

    lastTime = performance.now();

    requestAnimationFrame(loop);
  }
}

function jump() {
  if (state !== "running") return;
  if (player.jumping) return;

  player.vy = -650;
  player.jumping = true;
}

canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  jump();
});

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    jump();
  }
});

startBtn.addEventListener("click", startGame);
pauseBtn.addEventListener("click", togglePause);

function updateInfo() {
  scoreEl.textContent = score;
  timeEl.textContent = formatTime(elapsed);

  const percent = Math.min(
    100,
    (distance / TOTAL_DISTANCE) * 100
  );

  distanceEl.textContent = Math.floor(percent) + "%";
  progressBar.style.width = percent + "%";
}

// 進行度に応じた基本スピード
function getBaseSpeed() {
  const progress = distance / TOTAL_DISTANCE;

  if (progress < 1 / 3) {
    return SPEED_EARLY;
  }

  if (progress < 2 / 3) {
    return SPEED_MIDDLE;
  }

  return SPEED_LATE;
}

// 現在のスピード
function getSpeed() {
  return getBaseSpeed() +
    (boostTimer > 0 ? BOOST_AMOUNT : 0);
}

// アイテム取得時の加速
function activateBoost() {
  boostTimer = BOOST_DURATION;
}

function spawnObstacle() {
  const spawnX = W + 20;

  // アイテムの近くには障害物を出さない
  const blocked = items.some(item =>
    Math.abs(item.x - spawnX) < 220
  );

  if (blocked) return false;

  const types = [
    { name: "CASE", w: 48, h: 55 },
    { name: "CABLE", w: 65, h: 18 },
    { name: "BARRIER", w: 55, h: 65 }
  ];

  const type = types[
    Math.floor(Math.random() * types.length)
  ];

  obstacles.push({
    x: spawnX,
    y: ground - type.h,
    w: type.w,
    h: type.h,
    name: type.name,
    passed: false
  });

  return true;
}

function spawnItem() {
  const spawnX = W + 20;

  const obstacleNearby = obstacles.some(o =>
    Math.abs(o.x - spawnX) < 220
  );

  const itemNearby = items.some(item =>
    Math.abs(item.x - spawnX) < 130
  );

  if (obstacleNearby || itemNearby) return false;

  const types = [
    { name: "BOTTLE", points: 100, color: "#55a9df" },
    { name: "TOWEL", points: 150, color: "#ff9ab8" },
    { name: "FLAG", points: 200, color: "#6b7cff" }
  ];

  const type = types[
    Math.floor(Math.random() * types.length)
  ];

 const remainingDistance = TOTAL_DISTANCE - distance;
const isNearGoal = remainingDistance <= getSpeed() * 2;

let y;

if (isNearGoal) {
  y = ground - 20;
} else {
  const r = Math.random();

  if (r < 0.35) y = ground - 20;
  else if (r < 0.70) y = ground - 45;
  else y = ground - 140;
}

  items.push({
    x: spawnX,
    y: y,
    w: 25,
    h: 25,
    points: type.points,
    name: type.name,
    color: type.color
  });

  return true;
}

function overlap(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function update(dt) {
  elapsed += dt;

  // 加速時間を減らす
  if (boostTimer > 0) {
    boostTimer = Math.max(0, boostTimer - dt);
  }

  const speed = getSpeed();

  // 距離を進める
  distance += speed * dt;

  // ゴール到着
  if (distance >= TOTAL_DISTANCE) {
    distance = TOTAL_DISTANCE;
    updateInfo();
    finishGame();
    return;
  }

  // ジャンプ
  player.vy += 1700 * dt;
  player.y += player.vy * dt;

  if (player.y >= ground - player.h) {
    player.y = ground - player.h;
    player.vy = 0;
    player.jumping = false;
  }

  // 障害物出現
  spawnTimer -= dt;

  if (spawnTimer <= 0) {
    const spawned = spawnObstacle();

    spawnTimer = spawned
      ? 2.0 + Math.random() * 0.8
      : 0.25;
  }

  obstacles.forEach(o => {
    o.x -= speed * dt;

    if (!o.passed && overlap(player, o)) {
      score = Math.max(0, score - 100);
      o.passed = true;
      hitCount++;
      hitFlash = 0.2;
    }
  });

  obstacles = obstacles.filter(o =>
    o.x + o.w > 0
  );

  // アイテム出現
  itemTimer -= dt;

  if (itemTimer <= 0) {
    const spawned = spawnItem();

    itemTimer = spawned
      ? 1.5 + Math.random() * 1.0
      : 0.25;
  }

  items.forEach(item => {
    item.x -= speed * dt;

    // 横方向に少し取得判定を広げる
    const itemHitbox = {
      x: item.x - 8,
      y: item.y,
      w: item.w + 16,
      h: item.h
    };

    if (overlap(player, itemHitbox)) {
      score += item.points;
      item.collected = true;
      collectedCount++;

      // アイテム取得で一時加速
      activateBoost();
    }
  });

  items = items.filter(item =>
    item.x + item.w > 0 && !item.collected
  );

  hitFlash = Math.max(0, hitFlash - dt);

  updateInfo();
}

function drawBackground() {
  ctx.fillStyle = "#dff1ff";
  ctx.fillRect(0, 0, W, H);

  // 雲
  ctx.fillStyle = "#ffffff";

  for (let i = 0; i < 5; i++) {
    const x = (
      i * 190 - distance * 0.07
    ) % 950;

    ctx.beginPath();
    ctx.arc(x, 75, 22, 0, Math.PI * 2);
    ctx.arc(x + 25, 70, 28, 0, Math.PI * 2);
    ctx.arc(x + 50, 78, 20, 0, Math.PI * 2);
    ctx.fill();
  }

  // 街並み
  for (let i = 0; i < 9; i++) {
    const x = (
      i * 110 - distance * 0.15
    ) % 1000;

    ctx.fillStyle = "#afcbda";
    ctx.fillRect(x, 180, 65, 105);

    ctx.fillStyle = "#eaf3fa";

    for (let j = 0; j < 3; j++) {
      ctx.fillRect(x + 12, 195 + j * 25, 12, 12);
      ctx.fillRect(x + 38, 195 + j * 25, 12, 12);
    }
  }

  // 地面
  ctx.fillStyle = "#8ab4a0";
  ctx.fillRect(0, ground, W, H - ground);

  ctx.fillStyle = "#ffffff";

  for (let i = 0; i < 15; i++) {
    const x = (
      i * 75 - distance * 0.7
    ) % 850;

    ctx.fillRect(x, ground + 35, 35, 5);
  }
}

function drawPlayer() {
  const x = player.x;
  const y = player.y;

  // 頭
  ctx.fillStyle = "#f1c9a5";
  ctx.beginPath();
  ctx.arc(x + 18, y + 9, 10, 0, Math.PI * 2);
  ctx.fill();

  // 髪
  ctx.fillStyle = "#343b4c";
  ctx.beginPath();
  ctx.arc(x + 18, y + 5, 10, Math.PI, Math.PI * 2);
  ctx.fill();

  // ライブTシャツ
  ctx.fillStyle = "#6b7cff";
  ctx.fillRect(x + 5, y + 20, 26, 22);

  // シャツの柄
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(x + 13, y + 27, 10, 3);

  // 足
  ctx.strokeStyle = "#263b55";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(x + 12, y + 42);
  ctx.lineTo(x + 9, y + 51);
  ctx.moveTo(x + 25, y + 42);
  ctx.lineTo(x + 28, y + 51);
  ctx.stroke();
}

function drawObstacle(o) {
  if (o.name === "CASE") {
    ctx.fillStyle = "#48566b";
    ctx.fillRect(o.x, o.y, o.w, o.h);

    ctx.strokeStyle = "#afcbda";
    ctx.lineWidth = 3;
    ctx.strokeRect(
      o.x + 5, o.y + 5,
      o.w - 10, o.h - 10
    );
  }

  if (o.name === "CABLE") {
    ctx.strokeStyle = "#263b55";
    ctx.lineWidth = 8;
    ctx.beginPath();

    ctx.moveTo(o.x, o.y + 10);
    ctx.quadraticCurveTo(
      o.x + 30, o.y - 5,
      o.x + o.w, o.y + 10
    );

    ctx.stroke();
  }

  if (o.name === "BARRIER") {
    ctx.fillStyle = "#e58b75";
    ctx.fillRect(o.x, o.y, o.w, o.h);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(
      o.x + 5, o.y + 15,
      o.w - 10, 10
    );
  }
}

function drawItem(item) {
  ctx.fillStyle = item.color;

  if (item.name === "BOTTLE") {
    ctx.fillRect(item.x + 7, item.y + 4, 13, 21);
    ctx.fillRect(item.x + 10, item.y, 7, 5);

  } else if (item.name === "TOWEL") {
    ctx.fillRect(item.x, item.y + 5, 25, 15);

  } else {
    ctx.fillRect(item.x + 5, item.y, 17, 20);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(item.x + 9, item.y + 8, 9, 3);
  }
}

function draw() {
  drawBackground();

  obstacles.forEach(drawObstacle);
  items.forEach(drawItem);

  drawPlayer();

  // 加速中の表示
  if (boostTimer > 0 && state === "running") {
    ctx.fillStyle = "#6b7cff";
    ctx.font = "bold 20px Arial";
    ctx.textAlign = "left";
    ctx.fillText("SPEED UP!", 20, 35);
  }

  if (hitFlash > 0) {
    ctx.fillStyle = "rgba(255,80,80,0.18)";
    ctx.fillRect(0, 0, W, H);
  }

  if (state === "ready") {
    ctx.fillStyle = "#263b55";
    ctx.font = "bold 32px Arial";
    ctx.textAlign = "center";
    ctx.fillText("READY TO RUN?", W / 2, 125);
  }

  if (state === "paused") {
    ctx.fillStyle = "rgba(38,59,85,0.55)";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 40px Arial";
    ctx.textAlign = "center";
    ctx.fillText("PAUSED", W / 2, 170);
  }

  if (state === "finished") {
    ctx.fillStyle = "rgba(38,59,85,0.35)";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";

    ctx.font = "bold 40px Arial";
    ctx.fillText("YOU MADE IT!", W / 2, 135);

    ctx.font = "bold 22px Arial";
    ctx.fillText("KSPO DOME", W / 2, 175);
  }
}

function finishGame() {
  state = "finished";

  message.textContent =
    "GOAL! 完走タイム：" +
    formatTime(elapsed) +
    " ／ SCORE：" +
    score +
    "点";

  startBtn.textContent = "RETRY";
  startBtn.style.display = "inline-block";

  pauseBtn.style.display = "none";

  draw();
}

function loop(now) {
  if (state !== "running") return;

  const dt = Math.min(
    (now - lastTime) / 1000,
    0.04
  );

  lastTime = now;

  update(dt);
  draw();

  if (state === "running") {
    requestAnimationFrame(loop);
  }
}

updateInfo();
draw();

</script>

</body>
</html>
