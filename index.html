<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROAD TO KSPO DOME</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: "Mulmaru";
  src: url("./fonts/Mulmaru.woff2") format("woff2");
  font-weight: 400;
  font-display: swap;
}
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #eaf3fa;
  color: #263b55;
  font-family: "Jersey 10", Arial, sans-serif;
  text-align: center;
}

header {
  padding: 20px 10px 5px;
}

h1 {
  color: #6b7cff;
  font-family: "Jersey 10", sans-serif;
  font-size: 48px;
  letter-spacing: 2px;
  line-height: 1;
  margin: 5px 0;
  text-shadow: 3px 3px 0 #ffb5d0;
}

.small {
  font-family: "Jersey 10", sans-serif;
  font-size: 19px;
  letter-spacing: 1px;
  color: #71849a;
}

#game {
  width: 100%;
  max-width: 800px;
  margin: 10px auto;
  padding: 0 10px;
}

#info {
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 0;
  font-family: "Jersey 10", sans-serif;
  font-size: 22px;
  letter-spacing: 1px;
  color: #526a91;
}

#info span span {
  color: #6b7cff;
  font-size: 25px;
}

#progress {
  width: 100%;
  height: 13px;
  background: #d0dfeb;
  border: 2px solid #afcbda;
  border-radius: 3px;
  overflow: hidden;
  margin: 5px 0 10px;
}

#progressBar {
  height: 100%;
  width: 0%;
  background: repeating-linear-gradient(
    90deg,
    #6b7cff 0px,
    #6b7cff 12px,
    #9b8cff 12px,
    #9b8cff 16px
  );
  transition: width 0.1s linear;
}

canvas {
  width: 100%;
  display: block;
  background: #dff1ff;
  border: 4px solid #afcbda;
  border-radius: 5px;
  box-shadow: 5px 5px 0 #c7d7e8;
  touch-action: none;
}

#message {
  padding: 12px 5px;
  min-height: 45px;
  font-family: "Jersey 10", sans-serif;
  font-size: 23px;
  letter-spacing: 1px;
  color: #6b7cff;
}

button {
  background: #6b7cff;
  color: white;
  border: 3px solid #263b55;
  border-radius: 4px;
  box-shadow: 4px 4px 0 #263b55;
  padding: 10px 42px;
  font-family: "Jersey 10", sans-serif;
  font-size: 27px;
  letter-spacing: 1px;
  cursor: pointer;
  margin: 8px;
}

button:active {
  transform: translate(3px, 3px);
  box-shadow: 1px 1px 0 #263b55;
}

#pause {
  background: #ff9ab8;
  display: none;
  padding: 10px 30px;
}

.small {
  margin-top: 12px;
}
</style>
</head>

<body>

<header>
  <h1>ROAD TO KSPO DOME</h1>
  <div class="small">RUN TO YOUR DREAM!</div>
</header>

<div id="game">

  <div id="info">
    <span>SCORE: <span id="score">0</span></span>
    <span>TIME: <span id="time">00:00</span></span>
    <span>DISTANCE: <span id="distance">0%</span></span>
  </div>

  <div id="progress">
    <div id="progressBar"></div>
  </div>

  <canvas id="canvas" width="800" height="360"></canvas>

  <div id="message">LET'S RUN TO KSPO DOME!</div>

  <button id="start">START</button>
  <button id="pause">PAUSE</button>
  
<p class="small">TAP TO JUMP!</p>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const distanceEl = document.getElementById("distance");
const progressBar = document.getElementById("progressBar");
const message = document.getElementById("message");
const startBtn = document.getElementById("start");
const pauseBtn = document.getElementById("pause");

const W = 800;
const H = 360;
const ground = 285;

// ゴールまでの距離
const TOTAL_DISTANCE = 18000;

// 基本スピード
const SPEED_EARLY = 300;
const SPEED_MIDDLE = 340;
const SPEED_LATE = 380;

// アイテム取得時の加速
const BOOST_AMOUNT = 30;
const BOOST_DURATION = 3;

let state = "ready";
let score = 0;
let elapsed = 0;
let distance = 0;
let lastTime = 0;

let obstacles = [];
let items = [];

let spawnTimer = 0;
let itemTimer = 0;
let hitFlash = 0;

let hitCount = 0;
let collectedCount = 0;
let jumpCount = 0;

// 加速残り時間
let boostTimer = 0;

let runAnimationTime = 0;

const player = {
  x: 110,
  y: ground - 64,
  w: 48,
  h: 64,
  vy: 0,
  jumping: false
};

function formatTime(seconds) {
  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);

  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0")
  );
}

function resetGame() {
  score = 0;
  elapsed = 0;
  distance = 0;

  obstacles = [];
  items = [];

  spawnTimer = 1.8;
  itemTimer = 1.5;

  hitFlash = 0;
  hitCount = 0;
  collectedCount = 0;
  jumpCount = 0;
  boostTimer = 0;

  player.y = ground - player.h;
  player.vy = 0;
  player.jumping = false;

  updateInfo();
}

function startGame() {
  resetGame();

  state = "running";

  message.textContent = "GO! RUN TO KSPO!";

  startBtn.style.display = "none";
  pauseBtn.style.display = "inline-block";
  pauseBtn.textContent = "PAUSE";

  lastTime = performance.now();

  requestAnimationFrame(loop);
}

function togglePause() {
  if (state === "running") {
    state = "paused";

    message.textContent = "PAUSED";
    pauseBtn.textContent = "RESUME";

    draw();

  } else if (state === "paused") {
    state = "running";

    message.textContent = "GO! RUN TO KSPO!";
    pauseBtn.textContent = "PAUSE";

    lastTime = performance.now();

    requestAnimationFrame(loop);
  }
}

  function jump() {
  if (state !== "running") return;
  if (player.jumping) return;

  player.vy = -650;
  player.jumping = true;

  jumpCount++;
  }

canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  jump();
});

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    jump();
  }
});

startBtn.addEventListener("click", startGame);
pauseBtn.addEventListener("click", togglePause);

function updateInfo() {
  scoreEl.textContent = score;
  timeEl.textContent = formatTime(elapsed);

  const percent = Math.min(
    100,
    (distance / TOTAL_DISTANCE) * 100
  );

  distanceEl.textContent = Math.floor(percent) + "%";
  progressBar.style.width = percent + "%";
}

// 進行度に応じた基本スピード
function getBaseSpeed() {
  const progress = distance / TOTAL_DISTANCE;

  if (progress < 1 / 3) {
    return SPEED_EARLY;
  }

  if (progress < 2 / 3) {
    return SPEED_MIDDLE;
  }

  return SPEED_LATE;
}

// 現在のスピード
function getSpeed() {
  return getBaseSpeed() +
    (boostTimer > 0 ? BOOST_AMOUNT : 0);
}

// アイテム取得時の加速
function activateBoost() {
  boostTimer = BOOST_DURATION;
}


function spawnObstacle() {
  const spawnX = W + 20;

  // ゴールまで残り約4秒になったら新しい障害物を出さない
  const remainingDistance = TOTAL_DISTANCE - distance;

  if (remainingDistance <= getSpeed() * 4) {
    return false;
  }

  // アイテムの近くには障害物を出さない
  const blocked = items.some(item =>
    Math.abs(item.x - spawnX) < 220
  );

  if (blocked) return false;

  const types = [
  { name: "CASE", w: 52, h: 60 },
  { name: "CABLE", w: 70, h: 24 },
  { name: "CONE", w: 42, h: 58 }
];

  const type = types[
    Math.floor(Math.random() * types.length)
  ];

  obstacles.push({
    x: spawnX,
    y: ground - type.h,
    w: type.w,
    h: type.h,
    name: type.name,
    passed: false
  });

  return true;
}


function spawnItem() {
  const spawnX = W + 20;

  const obstacleNearby = obstacles.some(o =>
    Math.abs(o.x - spawnX) < 220
  );

  const itemNearby = items.some(item =>
    Math.abs(item.x - spawnX) < 130
  );

  if (obstacleNearby || itemNearby) return false;

  const types = [
    { name: "BOTTLE", points: 100, color: "#55a9df" },
    { name: "TOWEL", points: 150, color: "#ff9ab8" },
    { name: "FLAG", points: 200, color: "#6b7cff" }
  ];

  const type = types[
    Math.floor(Math.random() * types.length)
  ];

 const remainingDistance = TOTAL_DISTANCE - distance;
const isNearGoal = remainingDistance <= getSpeed() * 2;

let y;

if (isNearGoal) {
  y = ground - 20;
} else {
  const r = Math.random();

  if (r < 0.35) y = ground - 20;
  else if (r < 0.70) y = ground - 45;
  else y = ground - 140;
}

  items.push({
    x: spawnX,
    y: y,
    w: 25,
    h: 25,
    points: type.points,
    name: type.name,
    color: type.color
  });

  return true;
}

function overlap(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function update(dt) {
  elapsed += dt;
  if (!player.jumping) {
  runAnimationTime += dt;
  }

  // 加速時間を減らす
  if (boostTimer > 0) {
    boostTimer = Math.max(0, boostTimer - dt);
  }

  const speed = getSpeed();

  // 距離を進める
  distance += speed * dt;

  // ゴール到着
  // ドームの入口に到着したらゴール
const remainingDistance = TOTAL_DISTANCE - distance;

if (remainingDistance <= 50) {
  distance = TOTAL_DISTANCE;
  updateInfo();
  finishGame();
  return;
}

  // ジャンプ
  player.vy += 1700 * dt;
  player.y += player.vy * dt;

  if (player.y >= ground - player.h) {
    player.y = ground - player.h;
    player.vy = 0;
    player.jumping = false;
  }

  // 障害物出現
  spawnTimer -= dt;

  if (spawnTimer <= 0) {
    const spawned = spawnObstacle();

    spawnTimer = spawned
      ? 2.0 + Math.random() * 0.8
      : 0.25;
  }

  obstacles.forEach(o => {
    o.x -= speed * dt;

    if (!o.passed && overlap(player, o)) {
      score = Math.max(0, score - 100);
      o.passed = true;
      hitCount++;
      hitFlash = 0.2;
    }
  });

  obstacles = obstacles.filter(o =>
    o.x + o.w > 0
  );

  // アイテム出現
  itemTimer -= dt;

  if (itemTimer <= 0) {
    const spawned = spawnItem();

    itemTimer = spawned
      ? 1.5 + Math.random() * 1.0
      : 0.25;
  }

  items.forEach(item => {
    item.x -= speed * dt;

    // 横方向に少し取得判定を広げる
    const itemHitbox = {
      x: item.x - 8,
      y: item.y,
      w: item.w + 16,
      h: item.h
    };

    if (overlap(player, itemHitbox)) {
      score += item.points;
      item.collected = true;
      collectedCount++;

      // アイテム取得で一時加速
      activateBoost();
    }
  });

  items = items.filter(item =>
    item.x + item.w > 0 && !item.collected
  );

  hitFlash = Math.max(0, hitFlash - dt);

  updateInfo();
}

function drawBackground() {
function drawBackground() {
  // 空
  ctx.fillStyle = "#dff1ff";
  ctx.fillRect(0, 0, W, H);

  // 遠くの空の模様
  ctx.fillStyle = "#c9e5f5";
  ctx.fillRect(0, 130, W, 2);

  // ドット雲
  for (let i = 0; i < 5; i++) {
    const x = (
      i * 190 - distance * 0.07 + 1000
    ) % 1000;

    const y = 65 + (i % 2) * 25;

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x, y + 8, 54, 16);
    ctx.fillRect(x + 8, y, 30, 8);
    ctx.fillRect(x + 18, y - 5, 18, 8);
    ctx.fillRect(x + 45, y + 3, 12, 10);

    ctx.fillStyle = "#afcbda";
    ctx.fillRect(x + 5, y + 20, 45, 3);
  }

  // 遠くの建物
  for (let i = 0; i < 12; i++) {
    const x = (
      i * 95 - distance * 0.09 + 1200
    ) % 1200;

    const h = 55 + (i % 4) * 14;
    const y = 285 - h;

    ctx.fillStyle = "#c2dce9";
    ctx.fillRect(x, y, 65, h);

    ctx.fillStyle = "#eaf3fa";
    for (let j = 0; j < 3; j++) {
      ctx.fillRect(x + 12, y + 12 + j * 15, 8, 7);
      ctx.fillRect(x + 36, y + 12 + j * 15, 8, 7);
    }
  }

  // 手前の建物
  for (let i = 0; i < 9; i++) {
    const x = (
      i * 120 - distance * 0.17 + 1200
    ) % 1200;

    const h = 75 + (i % 3) * 15;
    const y = ground - h;

    ctx.fillStyle = "#afcbda";
    ctx.fillRect(x, y, 78, h);

    // 屋上
    ctx.fillStyle = "#71849a";
    ctx.fillRect(x + 5, y - 5, 68, 5);

    // 窓
    ctx.fillStyle = "#eaf3fa";
    for (let j = 0; j < 3; j++) {
      ctx.fillRect(x + 12, y + 12 + j * 20, 12, 10);
      ctx.fillRect(x + 34, y + 12 + j * 20, 12, 10);
      ctx.fillRect(x + 56, y + 12 + j * 20, 10, 10);
    }
  }

  // 地面
  ctx.fillStyle = "#8ab4a0";
  ctx.fillRect(0, ground, W, H - ground);

  // 地面の上端
  ctx.fillStyle = "#d4eadb";
  ctx.fillRect(0, ground, W, 5);

  // 地面のドット模様
  ctx.fillStyle = "#6d9d88";

  for (let i = 0; i < 25; i++) {
    const x = (
      i * 55 - distance * 0.7 + 1000
    ) % 1000;

    ctx.fillRect(x, ground + 17, 12, 4);
    ctx.fillRect(x + 20, ground + 31, 7, 4);
  }

  // 道の白いライン
  ctx.fillStyle = "#ffffff";

  for (let i = 0; i < 15; i++) {
    const x = (
      i * 75 - distance * 0.7 + 850
    ) % 850;

    ctx.fillRect(x, ground + 48, 35, 4);
  }
}

function drawKspoDome() {
  const remainingDistance = TOTAL_DISTANCE - distance;
  const speed = getSpeed();

  // ゴールまで残り約4秒になったら登場
  if (remainingDistance > speed * 4) return;

  // 近づくほど大きく、左に移動する
  const progress = Math.max(
    0,
    Math.min(1, 1 - remainingDistance / (speed * 4))
  );

  const x = 680 - progress * 600;
  const scale = 0.55 + progress * 0.65;

  ctx.save();
  ctx.translate(x, ground);
  ctx.scale(scale, scale);

  // ドーム外側
  ctx.fillStyle = "#263b55";
  ctx.fillRect(20, -75, 180, 75);

  // 屋根の段差
  ctx.fillRect(40, -88, 140, 13);
  ctx.fillRect(60, -98, 100, 10);
  ctx.fillRect(80, -105, 60, 7);

  // ドーム本体
  ctx.fillStyle = "#afcbda";
  ctx.fillRect(25, -70, 170, 70);

  // 屋根の内側
  ctx.fillStyle = "#71849a";
  ctx.fillRect(45, -82, 130, 12);
  ctx.fillRect(65, -92, 90, 10);
  ctx.fillRect(85, -99, 50, 7);

  // 正面の壁
  ctx.fillStyle = "#dff1ff";
  ctx.fillRect(40, -58, 140, 58);

  // 窓
  ctx.fillStyle = "#6b7cff";
  ctx.fillRect(50, -48, 18, 25);
  ctx.fillRect(75, -48, 18, 25);
  ctx.fillRect(145, -48, 18, 25);
  ctx.fillRect(170, -48, 5, 25);

  // 入り口
  ctx.fillStyle = "#263b55";
  ctx.fillRect(105, -42, 30, 42);

  // 看板
  ctx.fillStyle = "#6b7cff";
  ctx.fillRect(75, -65, 70, 13);

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 9px Arial";
  ctx.textAlign = "center";
  ctx.fillText("KSPO DOME", 110, -55);

  // 地面との境目
  ctx.fillStyle = "#263b55";
  ctx.fillRect(15, -3, 190, 3);

  ctx.restore();
}

function drawPlayer() {
  const x = Math.round(player.x);
  const y = Math.round(player.y);

    // 走るアニメーション
  const running = state === "running" && !player.jumping;
  const phase = running ? runAnimationTime * 14 : 0;

  // 左右の足を交互に振る
  const swing = running ? Math.sin(phase) : 0;
  const lift = running ? Math.abs(Math.cos(phase)) * 3 : 0;

  const leftX = Math.round(swing * 7);
  const rightX = Math.round(-swing * 7);

  const leftY = Math.round(lift);
  const rightY = Math.round(3 - lift);

  
  // 足（奥側）
  ctx.fillStyle = "#263b55";
  ctx.fillRect(x + 29 + rightX, y + 49 + rightY, 7, 9);
  ctx.fillRect(x + 26 + rightX, y + 56 + rightY, 12, 5);

  // 足（手前側）
  ctx.fillRect(x + 15 + leftX, y + 49 + leftY, 7, 9);
  ctx.fillRect(x + 12 + leftX, y + 56 + leftY, 12, 5);
  
  // 腕（奥側）
  ctx.fillStyle = "#263b55";
  ctx.fillRect(x + 3, y + 34, 7, 12);
  ctx.fillRect(x + 1, y + 42, 7, 7);

  // 手
  ctx.fillStyle = "#f1c9a5";
  ctx.fillRect(x + 1, y + 48, 7, 5);
  
  // Tシャツ本体
  ctx.fillStyle = "#8ed7f5";
  ctx.fillRect(x + 9, y + 30, 30, 21);
  ctx.fillRect(x + 5, y + 32, 8, 13);
  ctx.fillRect(x + 35, y + 32, 8, 13);

  // シャツの影
  ctx.fillStyle = "#55a9df";
  ctx.fillRect(x + 10, y + 47, 28, 4);

  // Tシャツの胸元マーク
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(x + 21, y + 36, 7, 3);
  ctx.fillRect(x + 23, y + 39, 3, 3);

  // 腕（手前側）
  ctx.fillStyle = "#263b55";
  ctx.fillRect(x + 36, y + 33, 7, 13);
  ctx.fillRect(x + 37, y + 43, 7, 7);

  // 手
  ctx.fillStyle = "#f1c9a5";
  ctx.fillRect(x + 37, y + 48, 7, 5);

  // 髪の後ろ
  ctx.fillStyle = "#343b4c";
  ctx.fillRect(x + 7, y + 5, 34, 25);
  ctx.fillRect(x + 4, y + 11, 7, 17);
  ctx.fillRect(x + 10, y + 25, 28, 7);

  // 顔
  ctx.fillStyle = "#f1c9a5";
  ctx.fillRect(x + 12, y + 9, 24, 22);
  ctx.fillRect(x + 15, y + 5, 18, 5);

  // 前髪
  ctx.fillStyle = "#343b4c";
  ctx.fillRect(x + 9, y + 5, 9, 9);
  ctx.fillRect(x + 17, y + 3, 10, 7);
  ctx.fillRect(x + 28, y + 6, 9, 7);

  // 髪のハイライト
  ctx.fillStyle = "#526078";
  ctx.fillRect(x + 14, y + 6, 7, 2);
  ctx.fillRect(x + 29, y + 9, 4, 2);

  // 目
  ctx.fillStyle = "#263b55";
  ctx.fillRect(x + 17, y + 17, 3, 4);
  ctx.fillRect(x + 29, y + 17, 3, 4);

  // ほっぺ
  ctx.fillStyle = "#e99e9e";
  ctx.fillRect(x + 13, y + 23, 4, 2);
  ctx.fillRect(x + 32, y + 23, 4, 2);

  // 口
  ctx.fillStyle = "#a75e67";
  ctx.fillRect(x + 23, y + 25, 3, 2);
}

function drawObstacle(o) {
  const x = Math.round(o.x);
  const y = Math.round(o.y);

  // 機材ケース
  if (o.name === "CASE") {
    // 外枠
    ctx.fillStyle = "#263b55";
    ctx.fillRect(x, y, 52, 60);

    // 本体
    ctx.fillStyle = "#71849a";
    ctx.fillRect(x + 4, y + 5, 44, 49);

    // 中央パネル
    ctx.fillStyle = "#48566b";
    ctx.fillRect(x + 10, y + 12, 32, 30);

    // パネルの光沢
    ctx.fillStyle = "#afcbda";
    ctx.fillRect(x + 13, y + 15, 26, 3);

    // 金属の角
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x + 4, y + 5, 6, 6);
    ctx.fillRect(x + 42, y + 5, 6, 6);
    ctx.fillRect(x + 4, y + 48, 6, 6);
    ctx.fillRect(x + 42, y + 48, 6, 6);

    // 持ち手
    ctx.fillStyle = "#263b55";
    ctx.fillRect(x + 16, y, 20, 7);
    ctx.fillStyle = "#afcbda";
    ctx.fillRect(x + 20, y + 2, 12, 3);

    // 留め具
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x + 24, y + 24, 5, 9);

    // キャスター
    ctx.fillStyle = "#263b55";
    ctx.fillRect(x + 6, y + 55, 9, 5);
    ctx.fillRect(x + 37, y + 55, 9, 5);
  }

    // ステージモニター
  else if (o.name === "CABLE") {
    // 本体の黒い輪郭
    ctx.fillStyle = "#263b55";
    ctx.fillRect(x + 1, y + 17, 68, 7);
    ctx.fillRect(x + 5, y + 11, 60, 7);
    ctx.fillRect(x + 10, y + 5, 50, 8);
    ctx.fillRect(x + 15, y + 2, 40, 5);

    // スピーカー面
    ctx.fillStyle = "#71849a";
    ctx.fillRect(x + 10, y + 11, 50, 7);
    ctx.fillRect(x + 15, y + 6, 40, 6);

    // スピーカーの外側
    ctx.fillStyle = "#263b55";
    ctx.fillRect(x + 25, y + 7, 20, 13);

    // スピーカーの円盤
    ctx.fillStyle = "#afcbda";
    ctx.fillRect(x + 28, y + 9, 14, 9);
    ctx.fillRect(x + 30, y + 8, 10, 11);

    // 中央部分
    ctx.fillStyle = "#48566b";
    ctx.fillRect(x + 33, y + 11, 5, 5);

    // 小さなオレンジのランプ
    ctx.fillStyle = "#f28b48";
    ctx.fillRect(x + 54, y + 14, 4, 3);

    // 上部のハイライト
    ctx.fillStyle = "#afcbda";
    ctx.fillRect(x + 19, y + 4, 24, 2);

    // 底のゴム足
    ctx.fillStyle = "#263b55";
    ctx.fillRect(x + 8, y + 23, 8, 2);
    ctx.fillRect(x + 54, y + 23, 8, 2);
  }
    
  // 三角コーン
  else if (o.name === "CONE") {
    // 底の黒い台座
    ctx.fillStyle = "#263b55";
    ctx.fillRect(x, y + 51, 42, 7);

    // コーンの輪郭
    ctx.fillRect(x + 5, y + 43, 32, 8);
    ctx.fillRect(x + 10, y + 30, 22, 13);
    ctx.fillRect(x + 14, y + 17, 14, 13);
    ctx.fillRect(x + 18, y + 7, 6, 10);
    ctx.fillRect(x + 19, y + 4, 4, 3);

    // オレンジ本体
    ctx.fillStyle = "#f28b48";
    ctx.fillRect(x + 7, y + 45, 28, 5);
    ctx.fillRect(x + 12, y + 32, 18, 11);
    ctx.fillRect(x + 16, y + 19, 10, 11);
    ctx.fillRect(x + 19, y + 8, 4, 9);

    // 白い反射ライン
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x + 13, y + 34, 16, 4);
    ctx.fillRect(x + 16, y + 21, 10, 4);

    // 台座のハイライト
    ctx.fillStyle = "#71849a";
    ctx.fillRect(x + 4, y + 53, 34, 2);
  }
}

function drawItem(item) {
  const x = Math.round(item.x);
  const y = Math.round(item.y);

  ctx.save();
  ctx.translate(x, y - 10);
  ctx.scale(1.8, 1.8);

  // ペットボトル
  if (item.name === "BOTTLE") {
    // 外枠
    ctx.fillStyle = "#263b55";
    ctx.fillRect(9, 1, 7, 4);
    ctx.fillRect(7, 5, 11, 3);
    ctx.fillRect(5, 8, 15, 15);
    ctx.fillRect(8, 23, 9, 2);

    // キャップ
    ctx.fillStyle = "#6b7cff";
    ctx.fillRect(10, 0, 5, 3);

    // ボトル本体
    ctx.fillStyle = "#8ed7f5";
    ctx.fillRect(9, 6, 7, 2);
    ctx.fillRect(7, 9, 11, 12);
    ctx.fillRect(9, 21, 7, 2);

    // 水の透明感
    ctx.fillStyle = "#dff7ff";
    ctx.fillRect(9, 10, 3, 9);

    // ラベル
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(7, 15, 11, 5);

    // ハート風マーク
    ctx.fillStyle = "#ff9ab8";
    ctx.fillRect(10, 16, 2, 2);
    ctx.fillRect(13, 16, 2, 2);
    ctx.fillRect(11, 18, 3, 1);

     // キラキラ
    ctx.fillStyle = "#ffd85c";
    ctx.fillRect(22, 18, 2, 5);
    ctx.fillRect(20, 20, 6, 2);
  }

  // タオル
  else if (item.name === "TOWEL") {
    // 影
    ctx.fillStyle = "#263b55";
    ctx.fillRect(1, 7, 24, 15);

    // タオル本体
    ctx.fillStyle = "#ff9ab8";
    ctx.fillRect(3, 5, 20, 14);
    ctx.fillRect(5, 3, 16, 2);

    // 明るい縁取り
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(4, 6, 18, 2);
    ctx.fillRect(4, 17, 18, 2);

    // 中央の模様
    ctx.fillStyle = "#ffd6e2";
    ctx.fillRect(8, 10, 9, 2);
    ctx.fillRect(10, 12, 5, 2);

    // ハート
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(10, 7, 2, 2);
    ctx.fillRect(14, 7, 2, 2);
    ctx.fillRect(11, 9, 4, 2);

    // フリンジ
    ctx.fillRect(5, 19, 2, 3);
    ctx.fillRect(10, 19, 2, 3);
    ctx.fillRect(15, 19, 2, 3);
    ctx.fillRect(20, 19, 2, 3);

    // キラキラ
    ctx.fillStyle = "#ffd85c";
    ctx.fillRect(22, 1, 2, 5);
    ctx.fillRect(20, 3, 6, 2);
  }

  // 旗
  else if (item.name === "FLAG") {
    // ポール
    ctx.fillStyle = "#263b55";
    ctx.fillRect(4, 2, 3, 22);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(5, 4, 1, 17);

    // 旗の外枠
    ctx.fillStyle = "#263b55";
    ctx.fillRect(7, 3, 17, 13);
    ctx.fillRect(9, 16, 13, 2);

    // 旗本体
    ctx.fillStyle = "#6b7cff";
    ctx.fillRect(9, 5, 13, 9);
    ctx.fillRect(11, 14, 9, 2);

    // 星マーク
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(14, 6, 3, 7);
    ctx.fillRect(12, 8, 7, 3);

    // ポールの土台
    ctx.fillStyle = "#263b55";
    ctx.fillRect(2, 23, 8, 2);

    // キラキラ
    ctx.fillStyle = "#ffd85c";
    ctx.fillRect(22, 18, 2, 5);
    ctx.fillRect(20, 20, 6, 2);
  }

  ctx.restore();
}


function draw() {
  drawBackground();

  drawKspoDome();

  obstacles.forEach(drawObstacle);
  items.forEach(drawItem);

  drawPlayer();

  // 加速中の表示
  if (boostTimer > 0 && state === "running") {
    ctx.fillStyle = "#6b7cff";
    ctx.font = '28px "Jersey 10", Arial';
    ctx.textAlign = "left";
    ctx.fillText("SPEED UP!", 20, 35);
  }

  if (hitFlash > 0) {
    ctx.fillStyle = "rgba(255,80,80,0.18)";
    ctx.fillRect(0, 0, W, H);
  }

  if (state === "ready") {
    ctx.fillStyle = "#263b55";
    ctx.font = '42px "Jersey 10", Arial';
    ctx.textAlign = "center";
    ctx.fillText("READY TO RUN?", W / 2, 125);
  }

  if (state === "paused") {
    ctx.fillStyle = "rgba(38,59,85,0.55)";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#ffffff";
    ctx.font = '48px "Jersey 10", Arial';
    ctx.textAlign = "center";
    ctx.fillText("PAUSED", W / 2, 170);
  }

 

 if (state === "finished") {
  ctx.fillStyle = "rgba(38,59,85,0.55)";
  ctx.fillRect(0, 0, W, H);

  // 紙吹雪
  const confetti = [
    [80, 65, "#ff9ab8"],
    [145, 115, "#ffffff"],
    [220, 55, "#6b7cff"],
    [285, 90, "#ffd36e"],
    [360, 45, "#ff9ab8"],
    [440, 105, "#ffffff"],
    [520, 55, "#6b7cff"],
    [600, 95, "#ffd36e"],
    [700, 50, "#ff9ab8"],
    [750, 125, "#ffffff"],
    [110, 210, "#6b7cff"],
    [260, 235, "#ff9ab8"],
    [540, 220, "#ffd36e"],
    [680, 205, "#6b7cff"]
  ];

  confetti.forEach(([x, y, color]) => {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, 8, 12);
  });

  // キラキラ
  const sparkles = [
    [170, 75], [315, 165], [490, 65],
    [650, 145], [730, 230], [75, 155]
  ];

  sparkles.forEach(([x, y]) => {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x - 2, y - 9, 4, 18);
    ctx.fillRect(x - 9, y - 2, 18, 4);
  });

  // 大きなRESULTパネル
  ctx.fillStyle = "#263b55";
  ctx.fillRect(130, 32, 540, 296);

  ctx.fillStyle = "#dff1ff";
  ctx.fillRect(136, 38, 528, 284);

  // タイトル帯
  ctx.fillStyle = "#6b7cff";
  ctx.fillRect(136, 38, 528, 60);

  ctx.textAlign = "center";
  ctx.font = '58px "Jersey 10", Arial';
  ctx.fillStyle = "#ffffff";
  ctx.fillText("GOAL!", W / 2, 83);

  // サブタイトル
  ctx.font = '26px "Jersey 10", Arial';
  ctx.fillStyle = "#526a91";
  ctx.fillText("WELCOME TO KSPO DOME!", W / 2, 132);

  // 4つの記録カード
  const cards = [
    { x: 160, y: 151, label: "TIME", value: formatTime(elapsed), color: "#ff9ab8" },
    { x: 420, y: 151, label: "SCORE", value: score, color: "#9b8cff" },
    { x: 160, y: 234, label: "ITEMS", value: collectedCount, color: "#55a9df" },
    { x: 420, y: 234, label: "뛰어!", value: jumpCount, color: "#ff9ab8" }
  ];

  cards.forEach(card => {
    ctx.fillStyle = "#afcbda";
    ctx.fillRect(card.x, card.y, 220, 70);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(card.x + 3, card.y + 3, 214, 64);

    ctx.fillStyle = card.color;
    ctx.fillRect(card.x + 3, card.y + 3, 7, 64);

    ctx.textAlign = "left";

    // 韓国語だけMulmaru
    if (card.label === "뛰어!") {
      ctx.font = '22px "Mulmaru"';
    } else {
      ctx.font = '26px "Jersey 10", Arial';
    }

    ctx.fillStyle = "#71849a";
    ctx.fillText(card.label, card.x + 20, card.y + 27);

    ctx.font = '38px "Jersey 10", Arial';
    ctx.fillStyle = "#263b55";
    ctx.fillText(String(card.value), card.x + 20, card.y + 59);
  });
 }
}
function finishGame() {
  state = "finished";

  message.textContent = "YOU MADE IT! CONGRATULATIONS!";

  startBtn.textContent = "RETRY";
  startBtn.style.display = "inline-block";

  pauseBtn.style.display = "none";

  draw();
}

function loop(now) {
  if (state !== "running") return;

  const dt = Math.min(
    (now - lastTime) / 1000,
    0.04
  );

  lastTime = now;

  update(dt);
  draw();

  if (state === "running") {
    requestAnimationFrame(loop);
  }
}

updateInfo();
draw();

</script>
