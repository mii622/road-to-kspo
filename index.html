<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROAD TO KSPO DOME</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: "Mulmaru";
  src: url("./fonts/Mulmaru.woff2") format("woff2");
  font-weight: 400;
  font-display: swap;
}
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #eaf3fa;
  color: #263b55;
  font-family: "Jersey 10", Arial, sans-serif;
  text-align: center;
}

header {
  padding: 20px 10px 5px;
}

h1 {
  color: #6b7cff;
  font-family: "Jersey 10", sans-serif;
  font-size: 48px;
  letter-spacing: 2px;
  line-height: 1;
  margin: 5px 0;
  text-shadow: 3px 3px 0 #ffb5d0;
}

.small {
  font-family: "Jersey 10", sans-serif;
  font-size: 19px;
  letter-spacing: 1px;
  color: #71849a;
}

#game {
  width: 100%;
  max-width: 800px;
  margin: 10px auto;
  padding: 0 10px;
}

#info {
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 0;
  font-family: "Jersey 10", sans-serif;
  font-size: 22px;
  letter-spacing: 1px;
  color: #526a91;
}

#info span span {
  color: #6b7cff;
  font-size: 25px;
}

#progress {
  width: 100%;
  height: 13px;
  background: #d0dfeb;
  border: 2px solid #afcbda;
  border-radius: 3px;
  overflow: hidden;
  margin: 5px 0 10px;
}

#progressBar {
  height: 100%;
  width: 0%;
  background: repeating-linear-gradient(
    90deg,
    #6b7cff 0px,
    #6b7cff 12px,
    #9b8cff 12px,
    #9b8cff 16px
  );
  transition: width 0.1s linear;
}

canvas {
  width: 100%;
  display: block;
  background: #dff1ff;
  border: 4px solid #afcbda;
  border-radius: 5px;
  box-shadow: 5px 5px 0 #c7d7e8;
  touch-action: none;
}

#message {
  padding: 12px 5px;
  min-height: 45px;
  font-family: "Jersey 10", sans-serif;
  font-size: 23px;
  letter-spacing: 1px;
  color: #6b7cff;
}

button {
  background: #6b7cff;
  color: white;
  border: 3px solid #263b55;
  border-radius: 4px;
  box-shadow: 4px 4px 0 #263b55;
  padding: 10px 42px;
  font-family: "Jersey 10", sans-serif;
  font-size: 27px;
  letter-spacing: 1px;
  cursor: pointer;
  margin: 8px;
}

button:active {
  transform: translate(3px, 3px);
  box-shadow: 1px 1px 0 #263b55;
}

#pause {
  background: #ff9ab8;
  display: none;
  padding: 10px 30px;
}

.small {
  margin-top: 12px;
}

/* キャラクター選択画面 */
#characterSelect {
  max-width: 800px;
  margin: 15px auto 25px;
  padding: 20px 12px;
  background: #f5f9ff;
  border: 4px solid #afcbda;
  border-radius: 8px;
  box-shadow: 5px 5px 0 #c7d7e8;
}

.select-title {
  color: #ffb5d0;
  font-size: 34px;
  letter-spacing: 2px;
  margin: 0 0 5px;
}

.select-subtitle {
  color: #71849a;
  font-size: 18px;
  margin-bottom: 20px;
}

.character-list {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 15px auto 25px;
}

.character-card {
  flex: 1;
  max-width: 210px;
  min-width: 0;
  padding: 12px 5px;
  background: #ffffff;
  border: 3px solid #c7d7e8;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.15s;
}

.character-card.selected {
  border-color: #6b7cff;
  background: #edf0ff;
  box-shadow: 0 0 0 3px #d9ddff;
  transform: translateY(-4px);
}

.character-card .member-name {
  display: block;
  color: #263b55;
  font-size: 25px;
  margin-top: 8px;
}

.character-card .member-name-en {
  display: block;
  color: #8a9bb0;
  font-size: 17px;
}

.character-preview {
  width: 100%;
  height: 145px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #eaf3fa;
  border-radius: 5px;
  color: #8a9bb0;
  font-family: Arial, sans-serif;
  font-size: 13px;
}

#selectedMessage {
  color: #6b7cff;
  font-size: 20px;
  min-height: 25px;
  margin: 10px 0;
}

#characterStart {
  min-width: 180px;
}

@media (max-width: 480px) {
  .character-list {
    gap: 7px;
  }

  .character-card {
    padding: 8px 3px;
  }

  .character-preview {
    height: 115px;
  }

  .character-card .member-name {
    font-size: 21px;
  }

  .character-card .member-name-en {
    font-size: 15px;
  }
}
/* ゲーム開始前はゲーム画面を隠す */
#game {
  display: none;
}
  
</style>
</head>

<body>

<header>
  <h1>ROAD TO KSPO DOME</h1>
  <div class="small">RUN TO YOUR DREAM!</div>
</header>

<div id="characterSelect">

  <h2 class="select-title">CHOOSE YOUR RUNNER!</h2>
  <div class="select-subtitle">WHO WILL RUN TO KSPO DOME?</div>

  <div class="character-list">

  <div class="character-card selected" data-character="yonghwa">
    <div class="character-preview">
      <canvas class="preview-canvas" width="90" height="110"></canvas>
    </div>
    <span class="member-name">YONG</span>
  </div>

  <div class="character-card" data-character="minhyuk">
    <div class="character-preview">
      <canvas class="preview-canvas" width="90" height="110"></canvas>
    </div>
    <span class="member-name">MIN</span>
  </div>

  <div class="character-card" data-character="jungshin">
    <div class="character-preview">
      <canvas class="preview-canvas" width="90" height="110"></canvas>
    </div>
    <span class="member-name">SHIN</span>
  </div>

</div>

  <div id="selectedMessage">YONG SELECTED!</div>

  <button id="characterStart">START</button>

</div>

<div id="game">

  <div id="info">
    <span>SCORE: <span id="score">0</span></span>
    <span>TIME: <span id="time">00:00</span></span>
    <span>DISTANCE: <span id="distance">0%</span></span>
  </div>

  <div id="progress">
    <div id="progressBar"></div>
  </div>

  <canvas id="canvas" width="800" height="360"></canvas>

  <div id="message">LET'S RUN TO KSPO DOME!</div>

  <button id="pause">PAUSE</button>
  <button id="start" style="display:none;">RETRY</button>
  
<p class="small">TAP TO JUMP!</p>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const distanceEl = document.getElementById("distance");
const progressBar = document.getElementById("progressBar");
const message = document.getElementById("message");
const startBtn = document.getElementById("start");
const pauseBtn = document.getElementById("pause");

const characterSelect = document.getElementById("characterSelect");
const characterStartBtn = document.getElementById("characterStart");
const selectedMessage = document.getElementById("selectedMessage");
const game = document.getElementById("game");
  
let selectedCharacter = "yonghwa";

const W = 800;
const H = 360;
const ground = 285;

// ゴールまでの距離
const TOTAL_DISTANCE = 18000;

// 基本スピード
const SPEED_EARLY = 300;
const SPEED_MIDDLE = 340;
const SPEED_LATE = 380;

// アイテム取得時の加速
const BOOST_AMOUNT = 30;
const BOOST_DURATION = 3;

// 障害物にぶつかったときの減速
const HIT_SLOW_DURATION = 2.5;
const HIT_SLOW_RATE = 0.75;

let state = "ready";
let score = 0;
let elapsed = 0;
let distance = 0;
let lastTime = 0;

let obstacles = [];
let items = [];

let spawnTimer = 0;
let itemTimer = 0;
let hitFlash = 0;

let hitCount = 0;
let collectedCount = 0;
let jumpCount = 0;

// 加速残り時間
let boostTimer = 0;

let hitSlowTimer = 0;

let runAnimationTime = 0;

const player = {
  x: 110,
  y: ground - 64,
  w: 48,
  h: 64,
  vy: 0,
  jumping: false
};

function formatTime(seconds) {
  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);

  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0")
  );
}

function resetGame() {
  score = 0;
  elapsed = 0;
  distance = 0;

  obstacles = [];
  items = [];

  spawnTimer = 1.8;
  itemTimer = 1.5;

  hitFlash = 0;
  hitCount = 0;
  collectedCount = 0;
  jumpCount = 0;
  boostTimer = 0;
  hitSlowTimer = 0;

  player.y = ground - player.h;
  player.vy = 0;
  player.jumping = false;

  updateInfo();
}

function startGame() {
  resetGame();

  state = "running";

  message.textContent = "GO! RUN TO KSPO!";
  startBtn.style.display = "none";

  pauseBtn.style.display = "inline-block";
  pauseBtn.textContent = "PAUSE";

  lastTime = performance.now();

  requestAnimationFrame(loop);
}

function togglePause() {
  if (state === "running") {
    state = "paused";

    message.textContent = "PAUSED";
    pauseBtn.textContent = "RESUME";

    draw();

  } else if (state === "paused") {
    state = "running";

    message.textContent = "GO! RUN TO KSPO!";
    pauseBtn.textContent = "PAUSE";

    lastTime = performance.now();

    requestAnimationFrame(loop);
  }
}

  function jump() {
  if (state !== "running") return;
  if (player.jumping) return;

  player.vy = -650;
  player.jumping = true;

  jumpCount++;
  }

canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  jump();
});

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    jump();
  }
});

// キャラクター選択
document.querySelectorAll(".character-card").forEach(card => {
  card.addEventListener("click", () => {

    document.querySelectorAll(".character-card").forEach(c => {
      c.classList.remove("selected");
    });

    card.classList.add("selected");

    selectedCharacter = card.dataset.character;

    const names = {
  yonghwa: "YONG",
  minhyuk: "MIN",
  jungshin: "SHIN"
};

    selectedMessage.textContent =
      names[selectedCharacter] + " SELECTED!";
    
    console.log("選択中:", selectedCharacter);
  });
});

// 選択してゲーム開始
characterStartBtn.addEventListener("click", () => {
  characterSelect.style.display = "none";
  game.style.display = "block";
  startGame();
});

// RETRYボタン
startBtn.addEventListener("click", () => {
  startBtn.style.display = "none";
  document.getElementById("game").style.display = "none";
  document.getElementById("characterSelect").style.display = "block";

  pauseBtn.style.display = "inline-block";
  pauseBtn.textContent = "PAUSE";

  state = "ready";
});

pauseBtn.addEventListener("click", togglePause);

function updateInfo() {
  scoreEl.textContent = score;
  timeEl.textContent = formatTime(elapsed);

  const percent = Math.min(
    100,
    (distance / TOTAL_DISTANCE) * 100
  );

  distanceEl.textContent = Math.floor(percent) + "%";
  progressBar.style.width = percent + "%";
}

// 進行度に応じた基本スピード
function getBaseSpeed() {
  const progress = distance / TOTAL_DISTANCE;

  if (progress < 1 / 3) {
    return SPEED_EARLY;
  }

  if (progress < 2 / 3) {
    return SPEED_MIDDLE;
  }

  return SPEED_LATE;
}

// 現在のスピード
function getSpeed() {

  const normalSpeed = getBaseSpeed() +
    (boostTimer > 0 ? BOOST_AMOUNT : 0);

  const slowProgress = hitSlowTimer / HIT_SLOW_DURATION;

  const slowRate = 1 - (1 - HIT_SLOW_RATE) * slowProgress;

  return normalSpeed * slowRate;

}

// アイテム取得時の加速
function activateBoost() {
  boostTimer = BOOST_DURATION;
}


function spawnObstacle() {
  const spawnX = W + 20;

  // ゴールまで残り約4秒になったら新しい障害物を出さない
  const remainingDistance = TOTAL_DISTANCE - distance;

  if (remainingDistance <= getSpeed() * 4) {
    return false;
  }

  // アイテムの近くには障害物を出さない
  const blocked = items.some(item =>
    Math.abs(item.x - spawnX) < 220
  );

  if (blocked) return false;

  const types = [
  { name: "CASE", w: 52, h: 60 },
  { name: "CABLE", w: 70, h: 24 },
  { name: "CONE", w: 42, h: 58 }
];

  const type = types[
    Math.floor(Math.random() * types.length)
  ];

  obstacles.push({
    x: spawnX,
    y: ground - type.h,
    w: type.w,
    h: type.h,
    name: type.name,
    passed: false
  });

  return true;
}


function spawnItem() {
  const spawnX = W + 20;

  const obstacleNearby = obstacles.some(o =>
    Math.abs(o.x - spawnX) < 220
  );

  const itemNearby = items.some(item =>
    Math.abs(item.x - spawnX) < 130
  );

  if (obstacleNearby || itemNearby) return false;

  const types = [
    { name: "BOTTLE", points: 100, color: "#55a9df" },
    { name: "TOWEL", points: 150, color: "#ff9ab8" },
    { name: "FLAG", points: 200, color: "#6b7cff" }
  ];

  const type = types[
    Math.floor(Math.random() * types.length)
  ];

 const remainingDistance = TOTAL_DISTANCE - distance;
const isNearGoal = remainingDistance <= getSpeed() * 2;

let y;

if (isNearGoal) {
  y = ground - 20;
} else {
  const r = Math.random();

  if (r < 0.35) y = ground - 20;
  else if (r < 0.70) y = ground - 45;
  else y = ground - 140;
}

  items.push({
    x: spawnX,
    y: y,
    w: 25,
    h: 25,
    points: type.points,
    name: type.name,
    color: type.color
  });

  return true;
}

function overlap(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function update(dt) {
  elapsed += dt;
  if (!player.jumping) {
  runAnimationTime += dt;
  }

  // 加速時間を減らす
if (boostTimer > 0) {
  boostTimer = Math.max(0, boostTimer - dt);
}

// 減速時間を減らす
if (hitSlowTimer > 0) {
  hitSlowTimer = Math.max(0, hitSlowTimer - dt);
}

  const speed = getSpeed();

  // 距離を進める
  distance += speed * dt;

  // ゴール到着
  // ドームの入口に到着したらゴール
const remainingDistance = TOTAL_DISTANCE - distance;

if (remainingDistance <= 50) {
  distance = TOTAL_DISTANCE;
  updateInfo();
  finishGame();
  return;
}

  // ジャンプ
  player.vy += 1700 * dt;
  player.y += player.vy * dt;

  if (player.y >= ground - player.h) {
    player.y = ground - player.h;
    player.vy = 0;
    player.jumping = false;
  }

  // 障害物出現
  spawnTimer -= dt;

  if (spawnTimer <= 0) {
    const spawned = spawnObstacle();

    spawnTimer = spawned
      ? 2.0 + Math.random() * 0.8
      : 0.25;
  }

  obstacles.forEach(o => {
    o.x -= speed * dt;

    if (!o.passed && overlap(player, o)) {
      score = Math.max(0, score - 100);
      o.passed = true;
      hitCount++;
      hitFlash = 0.2;
      hitSlowTimer = HIT_SLOW_DURATION;
    }
  });

  obstacles = obstacles.filter(o =>
    o.x + o.w > 0
  );

  // アイテム出現
  itemTimer -= dt;

  if (itemTimer <= 0) {
    const spawned = spawnItem();

    itemTimer = spawned
      ? 1.5 + Math.random() * 1.0
      : 0.25;
  }

  items.forEach(item => {
    item.x -= speed * dt;

    // 横方向に少し取得判定を広げる
    const itemHitbox = {
      x: item.x - 8,
      y: item.y,
      w: item.w + 16,
      h: item.h
    };

    if (overlap(player, itemHitbox)) {
      score += item.points;
      item.collected = true;
      collectedCount++;

      // アイテム取得で一時加速
      activateBoost();
    }
  });

  items = items.filter(item =>
    item.x + item.w > 0 && !item.collected
  );

  hitFlash = Math.max(0, hitFlash - dt);

  updateInfo();
}


function drawBackground() {
  // 空
  ctx.fillStyle = "#dff1ff";
  ctx.fillRect(0, 0, W, H);

  // 遠くの空の模様
  ctx.fillStyle = "#c9e5f5";
  ctx.fillRect(0, 130, W, 2);

  // ドット雲
  for (let i = 0; i < 5; i++) {
    const x = (
      (i * 190 - distance * 0.07 + 1000) % 1000 + 1000
    ) % 1000;

    const y = 65 + (i % 2) * 25;

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x, y + 8, 54, 16);
    ctx.fillRect(x + 8, y, 30, 8);
    ctx.fillRect(x + 18, y - 5, 18, 8);
    ctx.fillRect(x + 45, y + 3, 12, 10);

    ctx.fillStyle = "#afcbda";
    ctx.fillRect(x + 5, y + 20, 45, 3);
  }

  // 遠くの建物
  for (let i = 0; i < 12; i++) {
    const x = (
      (i * 95 - distance * 0.09 + 1200) % 1200 + 1200
    ) % 1200;

    const h = 55 + (i % 4) * 14;
    const y = ground - h;

    ctx.fillStyle = "#c2dce9";
    ctx.fillRect(x, y, 65, h);

    ctx.fillStyle = "#eaf3fa";
    for (let j = 0; j < 3; j++) {
      ctx.fillRect(x + 12, y + 12 + j * 15, 8, 7);
      ctx.fillRect(x + 36, y + 12 + j * 15, 8, 7);
    }
  }

  // 手前の建物
  for (let i = 0; i < 9; i++) {
    const x = (
      (i * 120 - distance * 0.17 + 1200) % 1200 + 1200
    ) % 1200;

    const h = 75 + (i % 3) * 15;
    const y = ground - h;

    ctx.fillStyle = "#afcbda";
    ctx.fillRect(x, y, 78, h);

    // 屋上
    ctx.fillStyle = "#71849a";
    ctx.fillRect(x + 5, y - 5, 68, 5);

    // 窓
    ctx.fillStyle = "#eaf3fa";
    for (let j = 0; j < 3; j++) {
      ctx.fillRect(x + 12, y + 12 + j * 20, 12, 10);
      ctx.fillRect(x + 34, y + 12 + j * 20, 12, 10);
      ctx.fillRect(x + 56, y + 12 + j * 20, 10, 10);
    }
  }

  // KSPO DOME周辺エリア
  const venueProgress = Math.max(
    0,
    Math.min(1, (distance / TOTAL_DISTANCE - 0.72) / 0.08)
  );

  // 街灯
  if (venueProgress > 0) {
    ctx.save();
    ctx.globalAlpha = venueProgress;

    for (let i = 0; i < 5; i++) {
      const x = (
        (i * 230 - distance * 0.25 + 1200) % 1200 + 1200
      ) % 1200;

      ctx.fillStyle = "#71849a";
      ctx.fillRect(x, 175, 5, ground - 175);

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(x - 9, 169, 23, 7);
      ctx.fillRect(x - 5, 165, 15, 4);

      ctx.fillStyle = "#fff4c2";
      ctx.fillRect(x - 5, 176, 15, 3);
    }

    ctx.restore();
  }

    // ガーランド
  const garlandProgress = Math.max(
    0,
    Math.min(1, (distance / TOTAL_DISTANCE - 0.80) / 0.10)
  );

  if (garlandProgress > 0) {
    ctx.save();
    ctx.globalAlpha = garlandProgress;

    for (let i = 0; i < 4; i++) {
      const x = (
        (i * 260 - distance * 0.25 + 1200) % 1200 + 1200
      ) % 1200;

      // ガーランドのひも
      ctx.fillStyle = "#71849a";
      ctx.fillRect(x, 118, 130, 2);
      ctx.fillRect(x + 130, 118, 2, 3);

      // カラフルな三角フラッグ
      const colors = ["#ff9fbd", "#ffe08a", "#6b7cff", "#ffffff"];

      for (let j = 0; j < 5; j++) {
        const fx = x + 12 + j * 25;
        const fy = 120 + Math.floor(Math.abs(j - 2) * 3);

        ctx.fillStyle = colors[j % colors.length];
        ctx.fillRect(fx, fy, 13, 5);
        ctx.fillRect(fx + 3, fy + 5, 7, 4);
        ctx.fillRect(fx + 5, fy + 9, 3, 3);
      }

      // ひもの上の小さなライト
      for (let j = 0; j < 4; j++) {
        ctx.fillStyle = "#fff4c2";
        ctx.fillRect(x + 25 + j * 30, 112, 5, 5);
        ctx.fillRect(x + 26 + j * 30, 117, 3, 3);
      }
    }

    ctx.restore();
  }
  
    // 水色のランニングトラック
  ctx.fillStyle = "#83c9e8";
  ctx.fillRect(0, ground, W, H - ground);

  // トラック上端
  ctx.fillStyle = "#c5edff";
  ctx.fillRect(0, ground, W, 5);

  // トラックの帯
  ctx.fillStyle = "#70b8dc";
  ctx.fillRect(0, ground + 8, W, 3);

  ctx.fillStyle = "#a8def5";
  ctx.fillRect(0, ground + 13, W, 2);

  // 会場周辺のフラッグ
  if (venueProgress > 0) {
    ctx.save();
    ctx.globalAlpha = venueProgress;

    for (let i = 0; i < 4; i++) {
      const x = (
        (i * 280 - distance * 0.32 + 1200) % 1200 + 1200
      ) % 1200;

      // 支柱
      ctx.fillStyle = "#526078";
      ctx.fillRect(x, 195, 4, ground - 195);

      // 旗の影・縁
      ctx.fillStyle = "#263b55";
      ctx.fillRect(x + 4, 198, 34, 23);

      // 旗本体
      ctx.fillStyle = "#6b7cff";
      ctx.fillRect(x + 4, 196, 32, 20);

function drawCharacterPreviews() {
  if (!spriteImg.complete || !spriteImg.naturalWidth) return;

  const imgW = spriteImg.naturalWidth;
  const imgH = spriteImg.naturalHeight;

  document.querySelectorAll(".character-card").forEach(card => {
    const key = card.dataset.character;
    const canvasEl = card.querySelector(".preview-canvas");
    if (!canvasEl || !topStandRatios[key]) return;

    const pCtx = canvasEl.getContext("2d");
    const r = topStandRatios[key];

    const sx = r.rx * imgW;
    const sy = r.ry * imgH;
    const sw = r.rw * imgW;
    const sh = r.rh * imgH;

    pCtx.clearRect(0, 0, canvasEl.width, canvasEl.height);
    pCtx.imageSmoothingEnabled = false;

    // 0.92 -> 0.74 にして全体をひとまわり小さく、余白をかわいくするよ
    const scale = Math.min(canvasEl.width / sw, canvasEl.height / sh) * 0.74;
    const dw = sw * scale;
    const dh = sh * scale;
    const dx = (canvasEl.width - dw) / 2;
    const dy = (canvasEl.height - dh) / 2;

    pCtx.drawImage(spriteImg, sx, sy, sw, sh, dx, dy, dw, dh);
  });
}

function drawPlayer() {

  const running = state === "running" && !player.jumping;
  const frameIndex = running ? Math.floor(runAnimationTime * 10) % frames.length : 0;
  const r = frames[frameIndex];

  const imgW = spriteImg.naturalWidth;
  const imgH = spriteImg.naturalHeight;
  const sx = r.rx * imgW;
  const sy = r.ry * imgH;
  const sw = r.rw * imgW;
  const sh = r.rh * imgH;

  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(spriteImg, sx, sy, sw, sh, x, y + bob, player.w, player.h);
  ctx.restore();
}

function finishGame() {
  state = "finished";

  message.textContent = "YOU MADE IT! CONGRATULATIONS!";

  startBtn.textContent = "RETRY";
  startBtn.style.display = "inline-block";

  pauseBtn.style.display = "none";

  draw();
}

function loop(now) {
  if (state !== "running") return;

  const dt = Math.min(
    (now - lastTime) / 1000,
    0.04
  );

  lastTime = now;

  update(dt);
  draw();

  if (state === "running") {
    requestAnimationFrame(loop);
  }
}
